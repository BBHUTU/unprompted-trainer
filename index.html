  syncBox.appendChild(codeRow);
  syncBox.appendChild(el("p", "sync-hint",
    "同步码是这份记录的钥匙：同一个码的设备会合并到一起；朋友在自己设备上首次同步会生成新码，记录进不到你这里。码和云账号都别外发。不配置也能用——「导出备份 / 导入合并」永远可用。"));

  // 动作按钮：两个输入框都填完之后才出现
  const syncTop = el("div", "sync-row");
  const syncBtn = el("button", "btn primary", "同步到其他设备");
  syncBtn.type = "button";
  syncBtn.style.padding = ".5rem .95rem";
  syncBtn.addEventListener("click", syncNow);
  syncTop.appendChild(syncBtn);

  const ioRow = el("div", "sync-row");
  const exportBtn = el("button", "btn ghost", "导出备份");
  exportBtn.type = "button";
  exportBtn.style.padding = ".45rem .8rem";
  exportBtn.addEventListener("click", exportHistory);
  ioRow.appendChild(exportBtn);

  const importLabel = el("label", "btn ghost", "导入合并");
  importLabel.style.cssText += ";padding:.45rem .8rem;cursor:pointer";
  const importInput = document.createElement("input");
  importInput.type = "file";
  importInput.accept = ".json,application/json";
  importInput.style.display = "none";
  importInput.addEventListener("change", () => {
    importHistoryFile(importInput.files && importInput.files[0]);
    importInput.value = "";
  });
  importLabel.appendChild(importInput);
  ioRow.appendChild(importLabel);
  syncTop.appendChild(ioRow);
  syncBox.appendChild(syncTop);

  const syncStatus = el("p", "sync-status", "");
  syncBox.appendChild(syncStatus);
  panel.appendChild(syncBox);

  const list = el("ul", "history-list");
  panel.appendChild(list);

  const done = el("button", "btn primary settings-done", "完成");
  done.type = "button";
  done.addEventListener("click", closeHistory);
  panel.appendChild(done);

  historyEl.appendChild(panel);
  ui.overlayHost.appendChild(historyEl);
  historyEl._list = list;
  historyEl._syncStatus = syncStatus;
  historyEl._codeInput = codeInput;
  historyEl._keyInput = keyInput;
  historyEl._syncBtn = syncBtn;
  renderHistoryList();
  renderSyncReady();
  setTimeout(() => done.focus(), 60);
}

function setSyncStatus(text) {
  if (historyEl && historyEl._syncStatus) historyEl._syncStatus.textContent = text || "";
}
// 没配云账号时把同步按钮标灰并要求先填 Key
function renderSyncReady() {
  if (!historyEl || !historyEl._syncBtn) return;
  const ready = !!loadMasterKey();
  historyEl._syncBtn.disabled = !ready;
  historyEl._syncBtn.textContent = ready ? "同步到其他设备" : "先填云账号才能同步";
  historyEl._syncBtn.style.opacity = ready ? "" : ".55";
  historyEl._syncBtn.style.cursor = ready ? "" : "not-allowed";
}
function renderHistoryList() {
  const list = historyEl._list;
  const data = loadHistory();
  list.innerHTML = "";
  if (!data.length) {
    list.appendChild(el("div", "history-empty", "还没有记录——抽一题，把计时走完，这里就会有第一条。"));
    return;
  }
  data.forEach(entry => {
    const li = el("li", "history-item");
    const head = el("div", "history-item-head");
    head.appendChild(el("span", "history-date", reviewFmtDate(entry.date)));
    head.appendChild(el("span", "history-topic", entry.topic));
    li.appendChild(head);
    const fillerN = entry.analysis ? entry.analysis.fillerTotal : 0;
    const meta = el("div", "history-meta");
    meta.innerHTML = ""
      + escapeHtml(entry.categoryLabel) + " · " + escapeHtml(entry.modeLabel)
      + " · 讲了约 " + Math.round(entry.spokenSec || 0) + " 秒"
      + (entry.punctual === true ? ' · <span class="history-score">准时 ✓</span>'
        : entry.punctual === false ? " · 超时 " + Math.round(entry.overtimeSec || 0) + " 秒" : "")
      + (entry.score ? ' · <span class="history-score">' + entry.score + "/10</span>" : "")
      + (entry.analysis ? " · 口头禅 " + fillerN + " 次" : " · 未复盘");
    li.appendChild(meta);

    const detail = el("div", "history-detail");
    if (entry.text) {
      detail.appendChild(el("h4", null, "原稿"));
      detail.appendChild(el("p", null, entry.text));
      // 洗稿文本不进云端（省额度），从别的设备合并来的记录要就地重算
      const cleaned = (entry.analysis && entry.analysis.cleaned) || analyzeSpeech(entry.text).cleaned;
      if (cleaned) {
        detail.appendChild(el("h4", null, "洗稿后"));
        detail.appendChild(el("p", "cleaned", cleaned));
      }
      if (entry.analysis && Object.keys(entry.analysis.counts || {}).length) {
        detail.appendChild(el("h4", null, "口头禅频次"));
        const p = el("p", null, Object.entries(entry.analysis.counts)
          .sort((a, b) => b[1] - a[1]).map(([w, n]) => `「${w}」×${n}`).join("　")
          + (entry.analysis.pauses ? `　（停顿）×${entry.analysis.pauses}` : ""));
        detail.appendChild(p);
      }
    }
    const actions = el("div", "history-item-actions");
    if (entry.text) {
      const expand = el("button", "history-expand", "展开详情");
      expand.type = "button";
      expand.addEventListener("click", () => li.classList.toggle("is-open"));
      actions.appendChild(expand);
    }
    const del = el("button", "history-del", "删除");
    del.type = "button";
    del.addEventListener("click", () => { deleteHistoryEntry(entry.id); renderHistoryList(); });
    actions.appendChild(del);
    li.appendChild(actions);
    li.appendChild(detail);
    list.appendChild(li);
  });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function closeHistory() {
  if (!historyEl) return;
  historyEl.remove();
  historyEl = null;
}

/* ---------------- 设置面板 ---------------- */
function toggleSettings() { state.settingsOpen ? closeSettings(true) : openSettings(); }
function openSettings() {
  if (locked()) return;
  state.settingsOpen = true;
  ui.settings.classList.add("is-open");
  ui.sTrigger.setAttribute("aria-expanded", "true");
  buildSettingsPanel();
}
function closeSettings(refocus) {
  state.settingsOpen = false;
  ui.settings.classList.remove("is-open");
  ui.sTrigger.setAttribute("aria-expanded", "false");
  if (settingsPanel) { settingsPanel.remove(); settingsPanel = null; }
  if (refocus) ui.sTrigger.focus();
}

function durationField(label, minutes, min, max, hint, onChange) {
  const wrap = el("div", "duration-field");
  const head = el("div", "duration-head");
  const lab = el("label", "duration-label", label);
  const val = el("span", "duration-value");
  val.setAttribute("aria-live", "polite");
  head.appendChild(lab); head.appendChild(val);
  const input = document.createElement("input");
  input.className = "duration-slider";
  input.type = "range";
  input.min = min; input.max = max; input.step = 1;
  input.value = minutes;
  input.setAttribute("aria-label", label);
  const ends = el("div", "duration-ends");
  ends.setAttribute("aria-hidden", "true");
  ends.appendChild(el("span", null, min + " 分钟"));
  ends.appendChild(el("span", null, max + " 分钟"));
  wrap.appendChild(head); wrap.appendChild(input); wrap.appendChild(ends);
  const hintEl = hint ? el("p", "duration-hint", hint) : null;
  if (hintEl) wrap.appendChild(hintEl);

  const sync = m => {
    val.textContent = duration(m * 60);
    input.setAttribute("aria-valuetext", duration(m * 60));
  };
  sync(minutes);
  input.addEventListener("input", () => {
    const m = Number(input.value);
    sync(m);
    onChange(m * 60);
  });
  return wrap;
}

function buildSettingsPanel() {
  const ov = el("div", "settings-overlay");
  ov.setAttribute("role", "presentation");
  ov.addEventListener("mousedown", e => { if (e.target === e.currentTarget) closeSettings(true); });
  const panel = el("div", "settings-panel");
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-modal", "true");
  panel.setAttribute("aria-label", "设置");

  const head = el("header", "settings-panel-head");
  const titleRow = el("div", "panel-title-row");
  const backBtn = el("button", "panel-back", "←");
  backBtn.type = "button";
  backBtn.setAttribute("aria-label", "返回上一屏");
  backBtn.addEventListener("click", () => closeSettings(true));
  titleRow.appendChild(backBtn);
  titleRow.appendChild(el("h2", "settings-panel-title", "设置"));
  head.appendChild(titleRow);
  head.appendChild(el("p", "settings-panel-blurb", "计时时长以整分钟为单位。演讲时长两种模式分开记，互不影响。"));
  panel.appendChild(head);

  panel.appendChild(durationField(
    state.mode === "deep-research" ? "演讲 · 深度研究" : "演讲 · 即兴开讲",
    Math.round(state.speech / 60), 1, 10,
    state.mode === "deep-research" ? "研究结束后输出的时长，默认 3 分钟" : "抽到题就开口，默认 1 分钟",
    v => {
      const key = state.mode === "deep-research" ? "speechDeep" : "speechCuff";
      const sec = normalize(key, v);
      if (state.mode === "deep-research") state.speechDeep = sec; else state.speechCuff = sec;
      saveNum(key, sec);
      state.speech = sec;
      if (state.phase === "idle" || state.phase === "ready") { state.remaining = state.speech; renderOverlay(); }
      render();
    }));

  panel.appendChild(durationField("研究", Math.round(state.research / 60), 1, 60, "仅深度研究模式", v => {
    state.research = normalize("research", v);
    saveNum("research", state.research);
    render();
  }));

  const muteRow = el("div", "settings-mute");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.id = "mute-checkbox";
  cb.checked = state.muted;
  cb.addEventListener("change", () => {
    state.muted = cb.checked;
    muted = cb.checked;
    saveBool("muted", cb.checked);
    if (!cb.checked) primeAudio();
  });
  const cbLabel = el("label", null, "关闭音效");
  cbLabel.setAttribute("for", "mute-checkbox");
  muteRow.appendChild(cb); muteRow.appendChild(cbLabel);
  panel.appendChild(muteRow);

  panel.appendChild(el("p", "settings-note", "设置会自动保存，下次打开还在。"));

  const done = el("button", "btn primary settings-done", "完成");
  done.type = "button";
  done.addEventListener("click", () => closeSettings(true));
  panel.appendChild(done);

  ov.appendChild(panel);
  ui.overlayHost.appendChild(ov);
  settingsPanel = ov;
  setTimeout(() => { const f = panel.querySelector("input, button"); if (f) f.focus(); }, 0);

  ov.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); closeSettings(true); return; }
    if (e.key !== "Tab") return;
    const SEL = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const items = Array.from(panel.querySelectorAll(SEL)).filter(n => !n.hasAttribute("disabled") && n.tabIndex !== -1);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

/* ---------------- 全局键盘 ---------------- */
document.addEventListener("keydown", e => {
  if (reviewOpen || historyEl) return;   // 复盘/历史面板自己处理 Esc
  if (running()) {
    if (e.key === "Escape") { e.preventDefault(); closeTimer(); }
    return;
  }
  if (state.settingsOpen || state.menuOpen) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (e.key === " " || e.key === "Enter") {
    if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
    e.preventDefault();
    doSpin();
  }
});

/* ---------------- 启动 ---------------- */
render();

/* ---------------- 息屏保护：计时期间尽量不让屏幕熄灭 ---------------- */
let wakeLock = null;
async function requestWake() {
  try {
    if (!("wakeLock" in navigator)) return;
    if (!wakeLock) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { /* 浏览器不支持或用户拒绝，忽略 */ }
}
function releaseWake() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running()) requestWake();
});

/* ---------------- 离线缓存（sw.js 存在时才生效，缺失不影响使用） ---------------- */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ---------------- 嵌入窗口逃生提示 ----------------
   线上版被发布平台套在 iframe 里，iframe 上没有 allow="microphone"，
   所以嵌入页**永远**拿不到麦克风（任何浏览器、任何系统设置都一样）。
   这里给一个显眼的出口，把用户带到顶层窗口去录音。 */
(function framedEscapeHint() {
  if (!IS_FRAMED) return;
  try { if (localStorage.getItem(PREFIX + "framedDismissed") === "1") return; } catch (e) {}

  const bar = el("div", "framed-hint");
  const text = el("span", "framed-hint-text");
  text.innerHTML = DIRECT_HOST_URL
    ? "🎤 <b>这里不能录音</b>　点右边用专用链接打开（可加到主屏幕）"
    : "🎤 <b>录音需要在独立窗口打开</b>　嵌入页会被浏览器禁掉麦克风（跟手机设置无关）";
  bar.appendChild(text);

  const btn = el("button", "framed-hint-btn", DIRECT_HOST_URL ? "用专用链接打开" : "在新窗口打开");
  btn.type = "button";
  btn.addEventListener("click", () => { openStandalone(); });
  bar.appendChild(btn);

  const close = el("button", "framed-hint-close", "×");
  close.type = "button";
  close.setAttribute("aria-label", "不再提示");
  close.addEventListener("click", () => {
    bar.remove();
    try { localStorage.setItem(PREFIX + "framedDismissed", "1"); } catch (e) {}
  });
  bar.appendChild(close);

  const host = document.getElementById("root") || document.body;
  host.appendChild(bar);
})();

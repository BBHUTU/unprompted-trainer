function clock(sec) {
  const t = Math.max(0, Math.floor(sec));
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}
function duration(sec) {
  const t = Math.max(0, Math.floor(sec));
  const m = Math.floor(t / 60), s = t % 60;
  if (m && s) return m + " 分 " + s + " 秒";
  if (m) return m + " 分钟";
  if (t === 0) return "0 分钟";
  return s + " 秒";
}
function normalize(kind, sec) {
  const def = kind === "research" ? 600 : kind === "speechDeep" ? 180 : 60;
  if (!Number.isFinite(sec)) return def;
  const max = kind === "research" ? 60 : 10;
  const m = Math.round(sec / 60);
  return clamp(m, 1, max) * 60;
}

const PREFIX = "unprompted:";
function loadNum(key, fallback) {
  try {
    const raw = window.localStorage.getItem(PREFIX + key);
    if (raw === null) return fallback;
    const n = Number(raw);
    return Number.isFinite(n) ? normalize(key, n) : fallback;
  } catch (e) { return fallback; }
}
function saveNum(key, val) {
  try { window.localStorage.setItem(PREFIX + key, String(normalize(key, val))); } catch (e) {}
}
function loadBool(key, fallback) {
  try {
    const raw = window.localStorage.getItem(PREFIX + key);
    if (raw === null) return fallback;
    if (raw === "true") return true;
    if (raw === "false") return false;
    return fallback;
  } catch (e) { return fallback; }
}

/* ---------------- 音效（Web Audio 合成，与原站一致） ---------------- */
let audioCtx = null, muted = false;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type, peak, dest) {
  const c = ac(), osc = c.createOscillator(), gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(1e-4, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(1e-4, start + dur);
  osc.connect(gain); gain.connect(dest);
  osc.start(start); osc.stop(start + dur + 0.02);
}
function tick(vol) {
  if (muted) return;
  const c = ac(), now = c.currentTime, dur = 0.018;
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(); src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(2200 + Math.random() * 800, now);
  filter.Q.value = 1.2;
  const gain = c.createGain();
  gain.gain.setValueAtTime(1e-4, now);
  gain.gain.exponentialRampToValueAtTime(0.55 * vol, now + 0.001);
  gain.gain.exponentialRampToValueAtTime(1e-4, now + dur);
  src.connect(filter); filter.connect(gain); gain.connect(c.destination);
  src.start(now); src.stop(now + dur + 0.01);
}
function landChime() {
  if (muted) return;
  const c = ac(), now = c.currentTime, g = c.createGain();
  g.gain.value = 0.45; g.connect(c.destination);
  [523.25, 659.25, 783.99].forEach((f, i) => tone(f, now + i * 0.07, 0.45, "sine", 0.28, g));
}
function finishChime() {
  if (muted) return;
  const c = ac(), now = c.currentTime, g = c.createGain();
  g.gain.value = 0.5; g.connect(c.destination);
  [392, 523.25, 659.25, 784].forEach((f, i) => tone(f, now + i * 0.12, 0.55, "triangle", 0.32, g));
  tone(1046.5, now + 0.55, 0.9, "sine", 0.22, g);
}

let menuFocusIndex = 0;
function renderMenu() {
  ui.menu.innerHTML = "";

  ui.menu.style.display = "";
  SELECTABLE.forEach((c, i) => {

        case "ArrowUp":
          e.preventDefault(); menuFocusIndex = (i - 1 + SELECTABLE.length) % SELECTABLE.length; renderMenu(); focusMenu(); break;
        case "Home": e.preventDefault(); menuFocusIndex = 0; renderMenu(); focusMenu(); break;
        case "End": e.preventDefault(); menuFocusIndex = SELECTABLE.length - 1; renderMenu(); focusMenu(); break;
        case "Enter": case " ": e.preventDefault(); setNiche(SELECTABLE[menuFocusIndex].id); closeMenu(true); break;

/* ---------------- 抽题 ---------------- */
let rafId = null, spinTimeout = null;
const SPIN_MS = 4800;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

function setTopicText(text) { state.topic = text; renderReel(); }

function resetTopicFor(list) {
  const t = pick(list);
  state.reelIndex = Math.max(0, list.indexOf(t));
  state.topic = t;
  state.landed = null;
  render();
}

function doSpin() {
  if (state.spinning || running()) return;
  primeAudio();
  state.spinning = true;
  state.landed = null;
  render();

  const list = topics, len = list.length;
  const from = state.reelIndex % len;
  const rounds = 3 + Math.floor(Math.random() * 3);
  const extra = len > 1 ? 1 + Math.floor(Math.random() * (len - 1)) : 0;
  const totalSteps = rounds * len + extra;
  const landIndex = (from + totalSteps) % len;

  const start = performance.now();
  let lastStep = -1, settled = false;

  const finish = () => {
    if (settled) return;
    settled = true;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    if (spinTimeout !== null) { clearTimeout(spinTimeout); spinTimeout = null; }
    state.reelIndex = landIndex;
    state.topic = list[landIndex];
    state.landed = list[landIndex];
    state.spinning = false;
    render();
    landChime();
  };

  const frame = now => {
    const p = Math.min(1, (now - start) / SPIN_MS);
    const eased = easeOutCubic(p);
    const step = Math.min(totalSteps, Math.floor(eased * totalSteps));
    if (step !== lastStep) {
      const idx = (from + step) % len;
      state.reelIndex = idx;
      setTopicText(list[idx]);
      tick(1 - p * 0.6);
      lastStep = step;
    }
    if (p < 1) rafId = requestAnimationFrame(frame);
    else finish();
  };
  rafId = requestAnimationFrame(frame);
  spinTimeout = setTimeout(finish, SPIN_MS + 300);
}

}

  if (locked()) return;
  state.niche = id;
  topics = catById(id).topics;
  resetTopicFor(topics);
}

/* ---------------- 口头禅分析与洗稿 ---------------- */
const PAUSE_MARK_RE = /（停顿\s*[0-9.]+\s*秒）/g;
// 无条件删除的填充词（中文里这些字出现基本都是语气词）
const FILLER_ALWAYS = ["呃", "额", "嗯", "啊", "呀", "哎", "诶"];
// 只在句尾（后跟标点/空白/结尾）删除的语气词
const FILLER_TAIL = ["呢"];
// 连接词后面的「呢」也是口头禅（然后呢 / 所以呢 …），删「呢」保留连接词
const FILLER_AFTER_CONNECTIVE = /(然后|所以|但是|那么|那|接着|而且|还有|另外|就是|最后|首先|其次|总之)呢/g;

function stripFillers(text, counts) {
  const add = (w, n) => { if (n > 0) counts[w] = (counts[w] || 0) + n; };
  let out = text;
  for (const w of FILLER_ALWAYS) {
    const re = new RegExp(w + "+", "g");
    const m = out.match(re);
    if (m) { add(w, m.length); out = out.replace(re, ""); }
  }
  // 句尾“呢”（后面是标点、空白或结尾）
  const tailRe = new RegExp("(" + FILLER_TAIL.join("|") + ")(?=[，。！？、；：,.!?;:\\s]|$)", "g");
  out = out.replace(tailRe, m => { add(m, 1); return ""; });
  // 连接词后的“呢”（然后呢 / 所以呢 …）
  out = out.replace(FILLER_AFTER_CONNECTIVE, (m, p1) => { add("呢", 1); return p1; });
  return out;
}

function tidyPunct(text) {
  const SEP = /[，。！？、；：,.!?;:]+/g;
  return String(text || "")
    // 连续的「分隔标点」只留优先级最高的一个；书名号/引号/括号绝不参与合并，
    // 否则「《反精致》，」会被并成「，」，把书名号吃掉
    .replace(SEP, run => {
      for (const p of ["。", "！", "？", "；", "，", "、"]) if (run.includes(p)) return p;
      return run[0];
    })
    .replace(/\s+/g, " ")
    .replace(/^[\s，。！？、；：,.!?;:]+/, "")
    .replace(/[\s，、；：]+$/, "")
    .trim();
}

/* ---------------- 重复检测（重复句 / 高频短语） ----------------
   白姐的原话：「我会习惯性的重复前一句话」——这是独立于口头禅的一类问题，
   口头禅是「嗯啊呢」这种填充字，重复是整句或整段短语又说一遍，得分开统计。 */

// 这些词反复出现是正常的，不算「重复」（虚词 / 连接词 / 代词 / 常用搭配）
const REPEAT_STOPWORDS = new Set([
  "就是", "然后", "所以", "因为", "但是", "如果", "这个", "那个", "一个", "我们", "他们", "你们", "自己",
  "可以", "什么", "没有", "觉得", "时候", "知道", "这样", "那样", "其实", "还是", "或者", "而且", "不过",
  "东西", "事情", "问题", "大家", "现在", "已经", "应该", "可能", "不是", "一定", "真的", "非常", "特别",
  "很多", "有些", "怎么", "为什么", "这么", "那么", "一直", "总是", "开始", "结束", "第一", "第二", "第三",
  "另外", "总之", "最后", "首先", "其次", "例如", "比如", "的话", "来说", "简单", "复杂", "感觉", "今天"
]);

function normForRepeat(s) {
  return String(s || "").replace(/[\s，。！？、；：,.!?;:""''（）()《》〈〉…—·]/g, "");
}

// 分词级切分：句末标点 + 逗号顿号都算边界。
// 白姐的「重复前一句话」常常是逗号分隔的短句（「…的时候，…的时候」），
// 只按句号切会一个都抓不到。
function splitClauses(t) {
  return String(t || "").split(/(?<=[。！？!?；;，、,.\n])/).map(s => s.trim()).filter(Boolean);
}

// 虚词开头的短语不是「重复」，是正常表达（的人生 / 主义的 / 当我们 / 我们的）
const REPEAT_BAD_HEAD = new Set("的了是在我你他她它们当如果一种这那就也都很会能要把被和与对为从到于而但却又再还只更最不没有所之其此该各每某些个".split(""));
const REPEAT_BAD_TAIL = new Set("的了是在和与为从到于而但却又再还只更最不没所之其此".split(""));

// 判断一个 n-gram 是不是「独立单位」：若它每次出现都固定跟同一个字相邻
// （左边恒为同一个字或右边恒为同一个字），那它只是更长重复串的一个切片。
function isMaximalGram(plain, g, n) {
  let i = -1, found = 0, rightFixed = null, leftFixed = null, rightSame = true, leftSame = true;
  while ((i = plain.indexOf(g, i + 1)) !== -1) {
    found++;
    const rc = plain[i + g.length] || "\u0000";
    const lc = i > 0 ? plain[i - 1] : "\u0000";
    if (rightFixed === null) rightFixed = rc; else if (rc !== rightFixed) rightSame = false;
    if (leftFixed === null) leftFixed = lc; else if (lc !== leftFixed) leftSame = false;
  }
  if (found !== n) return true;      // 计数对不上（重叠情况），保守放过
  return !(rightSame || leftSame);   // 两侧都随上下文变化才算独立单位
}

function findRepeats(text) {
  const t = String(text || "");

  // —— ① 紧邻重复（她说「习惯性重复前一句话」就是这种）：X，X ——
  // 精确比对整段分句抓不到它——第一处常常粘在上一句尾巴上没有标点，
  // 所以必须用「扫描 + 反向引用」的方式找到真正连说两遍的那一段。
  const spans = [];
  const spanSeen = new Set();
  const spanRe = /([\u4e00-\u9fa5]{6,40})[，、,](\s*)\1(?=[，、,。！？!?；;]|$)/g;
  let sm;
  while ((sm = spanRe.exec(t)) !== null) {
    const key = sm[1];
    if (spanSeen.has(key)) continue;
    spanSeen.add(key);
    spans.push({ text: key, n: 2 });
    if (spans.length >= 5) break;
  }

  // —— ② 重复分句：去标点后 ≥8 字、出现 ≥2 次 ——
  const sentMap = new Map();
  splitClauses(t).forEach(s => {
    const key = normForRepeat(s);
    if (key.length < 8) return;
    if (spanSeen.has(key)) return;                 // 已经被 ① 报过就别重复报
    if (!sentMap.has(key)) sentMap.set(key, { text: key, n: 0 });
    sentMap.get(key).n++;
  });
  const clauses = [...sentMap.values()]
    .filter(r => r.n >= 2)
    .sort((a, b) => b.n - a.n || b.text.length - a.text.length)
    .slice(0, 5);

  // —— ③ 高频短语：3~8 字滑窗，出现 ≥4 次，首尾不能是虚词 ——
  const plain = normForRepeat(t);
  const gram = new Map();
  for (let n = 3; n <= 8; n++) {
    for (let i = 0; i + n <= plain.length; i++) {
      const g = plain.slice(i, i + n);
      gram.set(g, (gram.get(g) || 0) + 1);
    }
  }
  let cands = [...gram.entries()].filter(([g, n]) =>
    n >= 4 &&
    !REPEAT_STOPWORDS.has(g) &&
    !REPEAT_BAD_HEAD.has(g[0]) &&
    !REPEAT_BAD_TAIL.has(g[g.length - 1])
  );
  // 跨词边界的碎片（「时候我们」「自己生活」）不是独立单位：若它每次都固定跟
  // 同一个字相邻（左或右），说明真正重复的是更长的那串，把这个碎片丢掉。
  cands = cands.filter(([g, n]) => isMaximalGram(plain, g, n));
  cands = cands.filter(([g]) => !cands.some(([g2]) => g2 !== g && g2.length > g.length && g2.includes(g)));
  const phrases = cands
    .sort((a, b) => b[1] - a[1] || b[0].length - a[0].length)
    .slice(0, 8)
    .map(([w, n]) => ({ text: w, n }));

  const items = [...spans, ...clauses];            // 真正「重复说了一遍」的
  const removed = spans.length + clauses.reduce((s, r) => s + (r.n - 1), 0);
  return { spans, clauses, items, phrases, removed, sentences: items };
}

// 洗稿的第二步：删紧邻重复 → 删重复分句 → 收尾润色（只动重复和标点，不改用词）
function stripRepeats(text) {
  let out = String(text || "");

  // 1) 紧邻重复：X，X → 只留一个 X（可连续命中多轮）
  const nearRe = /([\u4e00-\u9fa5]{6,40})[，、,](\s*)\1(?=[，、,。！？!?；;]|$)/g;
  for (let i = 0; i < 4; i++) {
    const next = out.replace(nearRe, "$1");
    if (next === out) break;
    out = next;
  }
  // 1b) 短促紧邻重复：我觉得我觉得 → 我觉得
  out = out.replace(/([\u4e00-\u9fa5]{2,5})([，、,]?)(?=\1)/g, "");

  // 2) 重复分句：同一句只留第一次出现
  const seen = new Set();
  out = splitClauses(out).filter(seg => {
    const key = normForRepeat(seg);
    if (key.length < 8) return true;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).join("");

  // 3) 润色：去多余空格，末尾补句号
  out = out.replace(/\s+/g, " ").trim();
  if (out && !/[。！？!?；;…]$/.test(out)) out += "。";
  return out;
}

/* ---------------- 结构重排（洗稿第二步：重组语言和结构，用词不改） ----------------
   白姐的原话：「按我说的大意和思路，在变动较小的情况下重新组织语言，优化结构」。
   ⚠️ 纯离线的网页读不懂语义，所以「换词、提炼金句、重写论据」做不到，也不该假装做到。
   但下面这些是能真做的、而且效果明显的结构级操作：
     ① 按录音里真实的停顿位置断句（她的原稿全是「（停顿 X 秒）」，一个标点都没有）
     ② 超长句在连接词处切开
     ③ 序数词（第一/第二/首先/其次/最后）各自独立成段
     ④ 按长停顿分自然段
     ⑤ 首句单独成段（开场），末句单独成段（收尾）
   全程只动断句、段落和标点，一个字都不换。 */

// 序数词 / 分点标记（出现在句首时，说明这里是一个新的分点）
const ORDINAL_RE = /(第一|第二|第三|第四|第五|首先|其次|再次|最后|其一|其二|一是|二是|三是)/g;
const ORDINAL_HEAD = /^(第一|第二|第三|第四|第五|首先|其次|再次|其一|其二|一是|二是|三是)/;

// 句中出现这些强连接词 / 分点词时，长句可以在这里断（前提：句子已经够长）
const MID_BREAK = /(如果你|如果|但是|所以|因为|最后|首先|其次|然后|接下来|不过|因此|于是|另外)/g;

/* 半截话判断：停顿发生在这些字后面，说明话没说完 —— 该用逗号，不能用句号。
   例：「这是一种（停顿 6.2 秒）」→ 用逗号接下去，不要断成一句。 */
const DANGLING_TAIL = /(的|一种|这个|那个|是|在|和|或者|以及|但|而|就是|比如|例如|因为|所以|如果|虽然|而且|并且|同时|还有|有一种|一种是|就是那种|得出|发现|看到|认为|觉得|讲到|说到)$/;

/* 长句在中点断开（只按强连接词，且总长 > 30 才动手）
   ⚠️ 切点前如果是半截话（「我们可以在」+「首先…」），这里根本不该断——
   否则会得到一句以「在」结尾的残句。 */
function splitAtMidBreaks(s) {
  if (s.length <= 30) return [s];
  const cuts = [];
  let m;
  const re = new RegExp(MID_BREAK.source, "g");
  while ((m = re.exec(s)) !== null) {
    if (m.index <= 4 || m.index >= s.length - 10) continue;
    const before = s.slice(Math.max(0, m.index - 12), m.index).replace(/[，。！？、；：\s]+$/, "");
    if (DANGLING_TAIL.test(before)) continue;      // 半截话，别在这断
    cuts.push(m.index);
  }
  if (!cuts.length) return [s];
  // 断点之间至少隔 10 字，避免切得太碎
  const kept = [];
  let last = -99;
  for (const c of cuts) { if (c - last >= 10) { kept.push(c); last = c; } }
  if (!kept.length) return [s];
  const parts = [];
  let start = 0;
  for (const c of kept) { parts.push(s.slice(start, c)); start = c; }
  parts.push(s.slice(start));
  return parts.map(x => x.trim()).filter(Boolean);
}

// 可以安全断句的连接词（在这些词前面断，语义不破）
const SAFE_CUT_AT = /(但是|所以|因为|由于|其实|而是|不过|因此|从而|而且|并且|同时|也就是说|换句话说|这意味着|然后|接下来|于是|另外|比如|例如|具体来说|总结一下|归根结底|最后|首先|其次)/g;

/* 超长句只在「安全断点」切开。
   ⚠️ 绝对不能在字中间硬切 —— 曾经把「怀疑的态度」切成「怀疑的态 / 度去搜索」。
   找不到安全断点就整句保留：宁可留一个长句（诊断里会报出来让她自己改），
   也不能交给她一份被切坏的稿子。 */
function splitAtSafePoints(s, limit) {
  if (s.length <= limit) return [s];
  const cuts = [];
  let m;
  const re = new RegExp(SAFE_CUT_AT.source, "g");
  while ((m = re.exec(s)) !== null) {
    if (m.index <= 8 || m.index >= s.length - 8) continue;
    const before = s.slice(Math.max(0, m.index - 12), m.index).replace(/[，。！？、；：\s]+$/, "");
    if (DANGLING_TAIL.test(before)) continue;      // 半截话，别在这断
    cuts.push(m.index);
  }
  if (!cuts.length) return [s];
  const parts = [];
  let start = 0;
  while (s.length - start > limit) {
    const cand = cuts.filter(c => c > start + 12 && c - start <= limit);
    if (!cand.length) {
      // 附近没有合适的断点：放宽一点，取最近的（总比留一个 100 字长句强）
      const far = cuts.filter(c => c > start + 12 && c - start <= limit * 2);
      if (!far.length) break;
      parts.push(s.slice(start, far[0]));
      start = far[0];
      continue;
    }
    const cut = cand[cand.length - 1];
    parts.push(s.slice(start, cut));
    start = cut;
  }
  parts.push(s.slice(start));
  return parts.map(x => x.trim()).filter(Boolean);
}

function restructureText(raw) {
  // ① 先删口头禅（口头禅会干扰断句判断），此时停顿标记还在
  const tmpCounts = {};
  let s = stripFillers(String(raw || ""), tmpCounts);

  // ② 停顿标记 → 标点（\u0001 是段落占位，躲开 stripRepeats 的空白压缩）
  //    ≥8 秒 = 段落；≥3 秒 = 句号；≥1.2 秒 = 逗号（只是换气）；更短的忽略
  //    停顿前的字如果接不下去（「这是一种…」），一律改逗号
  s = s.replace(/（停顿\s*([0-9.]+)\s*秒）/g, (m, secStr, offset, whole) => {
    const sec = parseFloat(secStr);
    const tailTxt = whole.slice(Math.max(0, offset - 12), offset).replace(/[，。！？、；：\s]+$/, "");
    const dangling = DANGLING_TAIL.test(tailTxt);
    // ⚠️ 停顿长 ≠ 段落结束：话没说完（「从而得出…」）就不该分段，
    //    否则段落末尾会留一个逗号，后面又被迫改成句号，语义就断了。
    if (sec >= 8) return dangling ? "，" : "。\u0001";
    if (sec >= 3) return dangling ? "，" : "。";
    if (sec >= 1.2) return "，";
    return "";
  }).replace(/（停顿[^）]*）/g, "");

  // ③ 删重复（此时已有句号边界，分句判断更准）
  s = stripRepeats(s);
  s = s.replace(/\u0001/g, "\n\n");

  // ④ 逐段断句 → 长句在中点断 → 超长句在安全点断 → 枚举词另起段
  const out = [];
  for (const para of s.split(/\n{2,}/)) {
    const p = para.replace(/[\n\u0001]/g, "").trim();
    if (!p) continue;

    const sents = [];
    for (const raw0 of p.split(/(?<=[。！？!?；;])/)) {
      const sent = raw0.trim();
      if (!sent) continue;
      const body = sent.replace(/[。！？!?；;]+$/, "");
      if (!body) continue;
      const end = /[！？!?]/.test(sent.slice(-1)) ? sent.slice(-1) : "。";
      for (const mc of splitAtMidBreaks(body)) {
        if (mc.length <= 55) { sents.push(mc + "。"); continue; }
        splitAtSafePoints(mc, 45).forEach(c => sents.push(c + "。"));
      }
    }

    // 明确的枚举词（第一/第二/首先/其次…）独立成段 = 最有效的结构优化
    let cur = [];
    const flush = () => { if (cur.length) { out.push(cur.join("")); cur = []; } };
    for (const sent of sents) {
      const bare = sent.replace(/[。！？!?；;]+$/, "");
      if (ORDINAL_HEAD.test(bare) && cur.length) flush();
      cur.push(sent);
    }
    flush();
  }

  // ⑤ 收尾：统一标点
  const paragraphs = out
    .map(g => {
      let x = tidyPunct(g).replace(/[，、；：]+$/, "");
      if (x && !/[。！？!?…]$/.test(x)) x += "。";
      return x;
    })
    .filter(Boolean);

  return { text: paragraphs.join("\n\n"), paragraphs };
}

/* 结构骨架：这套骨架进诊断结论里的「优点 / 缺点」 */
function detectStructure(restructuredText) {
  const text = String(restructuredText || "");
  const paras = text.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
  const sents = text.split(/(?<=[。！？!?])/).map(x => x.trim()).filter(Boolean);
  const first = paras[0] || "";
  const lastFull = sents.length ? sents[sents.length - 1] : "";
  // 收尾看的是最后一个「分句」的落点：长句里最后一个逗号之后那截才是真正的话尾
  const lastClause = lastFull.replace(/[。！？!?]+$/, "").split(/[，、,；]/).pop().trim();
  const lastSent = lastClause || lastFull.replace(/[。！？!?]+$/, "");

  // 开场钩子：提问 / 直接给情境
  const hasHook = /[？?]/.test(first.slice(0, 60)) || /(你是否|你有没有|你见过|想象一下|假如|如果我说|我问你)/.test(first.slice(0, 40));
  // 收尾：最后一句短、且是个结论（不是半截话）
  const hasClosing = !!lastSent && lastSent.length <= 45 && !/(并且|而且|以及|甚至还要|然后)$/.test(lastSent);

  // 分点：枚举词（每种只算一次）
  const points = [];
  const seen = new Set();
  let m;
  const re = new RegExp(ORDINAL_RE.source, "g");
  while ((m = re.exec(text)) !== null) {
    if (seen.has(m[1])) continue;
    seen.add(m[1]);
    points.push({ mark: m[1], at: m.index });
  }

  // 超长句：以最终成品为准（还有多长的句子没被拆开）
  const longSentences = sents
    .map(x => x.replace(/[。！？!?]+$/, ""))
    .filter(x => x.length > 45)
    .slice(0, 3)
    .map(x => ({ text: x.slice(0, 34) + (x.length > 34 ? "…" : ""), len: x.length }));

  // 举例：显式举例词，或者开头在列举具体事例（连着两个短句，平均 ≤ 22 字）
  const opening = sents.slice(0, 2).map(x => x.replace(/[。！？!?]+$/, ""));
  const avgOpen = opening.length ? opening.reduce((a, x) => a + x.length, 0) / opening.length : 999;
  const enumerating = opening.length >= 2 && avgOpen <= 22;
  const hasExample = /(比如|例如|举个例子|就像|打个比方|好比)/.test(text)
    || /[0-9]+(%|倍|岁|年|万|亿)/.test(text)
    || enumerating;

  return {
    paragraphs: paras.length,
    hasHook, hasClosing, hasExample,
    firstText: first.slice(0, 50),
    lastText: lastSent.slice(0, 50),
    points, longSentences,
    avgParaLen: paras.length ? Math.round(paras.reduce((s, p) => s + p.length, 0) / paras.length) : 0
  };
}

/* 主题关键词：离线能做的是「高频实词」，不是语义概括（别假装读懂了） */
const TOPIC_STOP = new Set([
  ...REPEAT_STOPWORDS,
  "我们", "你们", "他们", "自己", "这种", "那种", "一种", "这些", "那些", "一些", "所有", "全部",
  "非常", "特别", "比较", "更加", "越来越", "可能", "需要", "可以", "应该", "必须", "能够", "得到",
  "事情", "方面", "情况", "过程", "结果", "内容", "部分", "地方", "时间", "时候", "现在", "当今",
  "因为", "所以", "但是", "如果", "虽然", "即使", "而且", "并且", "然后", "接着", "最后", "首先"
]);
function extractKeywords(text, limit) {
  const plain = String(text || "").replace(/[^\u4e00-\u9fa5]/g, "");
  const cnt = new Map();
  for (let n = 2; n <= 6; n++) {
    for (let i = 0; i + n <= plain.length; i++) {
      const g = plain.slice(i, i + n);
      if (TOPIC_STOP.has(g)) continue;
      if (REPEAT_BAD_HEAD.has(g[0]) || REPEAT_BAD_TAIL.has(g[g.length - 1])) continue;
      cnt.set(g, (cnt.get(g) || 0) + 1);
    }
  }
  let cands = [...cnt.entries()].filter(([g, n]) => n >= 2 && g.length >= 2);
  // 只留最长的：被更长候选包含的短候选丢掉（「批判性思维」赢过「批判」「思维」）
  cands = cands.filter(([g]) => !cands.some(([g2, n2]) => g2 !== g && g2.length > g.length && g2.includes(g) && n2 >= 2));
  return cands
    .sort((a, b) => b[1] * b[0].length - a[1] * a[0].length)
    .slice(0, limit || 5)
    .map(([text, n]) => ({ text, n }));
}

/* 诊断结论：主题 / 优点 / 缺点 —— 每条都带证据，不说空话 */
function buildDiagnosis(stats, spokenSec, plannedSec, timing, st) {
  const per100 = stats.rawWords > 0 ? stats.fillerTotal / stats.rawWords * 100 : 0;
  const wpm = spokenSec > 5 ? Math.round(stats.rawWords / spokenSec * 60) : 0;
  const repItems = (stats.repeats && stats.repeats.items) || [];
  const repPhrases = (stats.repeats && stats.repeats.phrases) || [];

  const keywords = extractKeywords(stats.sourceText || "", 5);

  const pros = [];
  const cons = [];

  // —— 结构 ——
  if (st.hasHook) pros.push({ t: "开场有钩子", e: "第一句就把人拉进来：「" + st.firstText.slice(0, 22) + "…」" });
  else cons.push({ t: "开场没有钩子", e: "开头是平铺直叙，听众不知道为什么要听下去。第一句换成一个提问或一个具体场景会好很多。" });

  if (st.points.length >= 2) {
    pros.push({ t: "有明确分点（" + st.points.length + " 步）", e: "用了「" + st.points.map(p => p.mark).join("」「") + "」，听众跟得住" });
  } else {
    cons.push({ t: "没有分点", e: "全程是一口气讲下来的，没有一个「第一、第二」。加 2-3 个序数词，听众才有路标。" });
  }

  if (st.hasClosing) pros.push({ t: "收尾有落点", e: "最后一句收在「" + st.lastText.slice(0, 22) + "…」" });
  else cons.push({ t: "收尾偏长、没有金句", e: "结尾还在解释，没有一句能让人记住的话。留一句短的下结论。" });

  if (st.paragraphs >= 3) pros.push({ t: "段落层次清楚（" + st.paragraphs + " 段）", e: "平均每段 " + st.avgParaLen + " 字" });

  if (st.hasExample) pros.push({ t: "有具体例子", e: "不是空讲道理，有能落地的东西" });
  else cons.push({ t: "缺具体例子", e: "通篇是抽象论述，没有一个「比如……」。一个具体案例抵三句道理。" });

  // —— 语言 ——
  if (per100 <= 1) pros.push({ t: "口头禅控制得好", e: per100.toFixed(1) + " 处/百字，几乎听不出来" });
  else if (per100 > 2) cons.push({ t: "口头禅偏多", e: per100.toFixed(1) + " 处/百字（" + stats.fillerTotal + " 处），听众会分神" });

  if (repItems.length) cons.push({ t: "有整段重复", e: repItems.length + " 处把同一段话说了两遍，最明显是「" + (repItems[0].text || "").slice(0, 16) + "」" });
  else pros.push({ t: "没有整段重复", e: "同一段话没有说两遍" });

  if (st.longSentences.length) cons.push({ t: "句子太长（" + st.longSentences.length + " 处超 50 字）", e: "最长一句 " + st.longSentences[0].len + " 字，一口气讲完听众接不住" });

  // —— 时间 / 语速 ——
  if (timing && timing.punctual === true && plannedSec) pros.push({ t: "时间控制到位", e: "在 " + duration(plannedSec) + "内收住了" });
  if (timing && timing.punctual === false) cons.push({ t: "超时", e: "超出 " + duration(timing.overtimeSec || 0) + "，说明内容没压缩过" });
  if (wpm && wpm >= 170 && wpm <= 300) pros.push({ t: "语速舒服", e: wpm + " 字/分钟，不快不慢" });
  else if (wpm > 330) cons.push({ t: "语速偏快", e: wpm + " 字/分钟，听众跟不上" });
  else if (wpm && wpm < 130) cons.push({ t: "语速偏慢", e: wpm + " 字/分钟，容易显得没底气" });

  if (stats.pauses > 5) cons.push({ t: "长停顿偏多", e: stats.pauses + " 次超过 1.5 秒，思路在找词" });

  return {
    keywords,
    pros: pros.slice(0, 5),
    cons: cons.slice(0, 5),
    repPhrases,
    per100, wpm
  };
}

function analyzeSpeech(text, opts) {
  const light = !!(opts && opts.light);   // 实时输入时只要口头禅/停顿，不必每次跑结构重排
  const counts = {};
  let t = String(text || "");
  // 停顿标记先取出来
  const pauseMarks = t.match(PAUSE_MARK_RE) || [];
  const pauses = pauseMarks.length;
  t = t.replace(PAUSE_MARK_RE, " ");
  // 重复要在删口头禅之前统计——否则「嗯」这类填充字会干扰滑窗
  const repeats = findRepeats(t);
  let body = stripFillers(t, counts);
  body = stripRepeats(body);          // 洗稿：删重复 + 收尾润色（第一版，只删）
  const cleaned = tidyPunct(body);
  // 第二版：结构重排（断句 / 分段 / 分点），用词不改
  const restructured = light ? { text: "", paragraphs: [] } : restructureText(text);
  const structure = light ? null : detectStructure(restructured.text);
  const fillerTotal = Object.values(counts).reduce((s, n) => s + n, 0);
  const words = cleaned.replace(/\s/g, "").length;
  const raw = text.replace(PAUSE_MARK_RE, "").replace(/\s/g, "").length;
  return {
    counts, fillerTotal, pauses, cleaned, words, rawWords: raw, repeats,
    restructured: restructured.text, paragraphs: restructured.paragraphs,
    structure, sourceText: cleaned
  };
}


function scoreSpeech(stats, spokenSec, timing) {
  const per100 = stats.rawWords > 0 ? stats.fillerTotal / stats.rawWords * 100 : 0;
  if (stats.rawWords < 15) {
    return { score: 0, per100, wpm: 0, parts: [], reasons: ["内容太短，还不构成一次完整输出，先别管分数"] };
  }
  const parts = [];
  let score = 0;

  // ① 口头禅密度（满分 3）
  let fillerPt;
  if (per100 <= 0.5) fillerPt = 3;
  else if (per100 <= 1.5) fillerPt = 2;
  else if (per100 <= 3) fillerPt = 1;
  else fillerPt = 0;
  score += fillerPt;
  parts.push({ label: "口头禅密度", detail: per100.toFixed(1) + " 处/百字", pt: fillerPt, max: 3 });

  // ② 长停顿（满分 1）
  const pausePt = stats.pauses <= 2 ? 1 : 0;
  score += pausePt;
  parts.push({ label: "长停顿", detail: stats.pauses + " 次（超 1.5 秒）", pt: pausePt, max: 1 });

  // ③ 语速（满分 1）
  const wpm = spokenSec > 5 ? Math.round(stats.rawWords / spokenSec * 60) : 0;
  let wpmPt = 0;
  if (wpm >= 170 && wpm <= 300) wpmPt = 1;
  score += wpmPt;
  parts.push({ label: "语速", detail: wpm ? wpm + " 字/分钟" : "时长太短，测不出", pt: wpmPt, max: 1 });

  // ④ 重复（满分 3）——「习惯性重复前一句话」是独立于口头禅的另一类问题
  const rep = stats.repeats || { items: [], phrases: [] };
  const repSent = (rep.items || []).length, repPhr = (rep.phrases || []).length;
  let repPt;
  if (repSent === 0) repPt = repPhr <= 2 ? 3 : repPhr <= 4 ? 2 : 1;
  else if (repSent === 1) repPt = 2;
  else if (repSent === 2) repPt = 1;
  else repPt = 0;
  score += repPt;
  parts.push({
    label: "重复",
    detail: repSent + " 处整段重复 · " + repPhr + " 个高频短语",
    pt: repPt, max: 3
  });

  // ⑤ 时间控制（满分 2，可扣到 -3）——在标准时间内说完是硬指标
  let timePt = 0, timeDetail = "这一轮没走计时，不计入";
  if (timing && timing.plannedSec > 0) {
    const over = Math.max(0, timing.overtimeSec || 0);
    const ratio = spokenSec / timing.plannedSec;
    if (over > 0) {
      if (over > timing.plannedSec * 2) { timePt = -3; timeDetail = "超时 " + duration(over) + "，超过标准时长 2 倍以上"; }
      else if (over > timing.plannedSec * 0.5) { timePt = -2; timeDetail = "超时 " + duration(over) + "，超出标准时长一半以上"; }
      else if (over > timing.plannedSec * 0.2) { timePt = -1; timeDetail = "超时 " + duration(over); }
      else { timePt = 0; timeDetail = "超时 " + duration(over) + "（轻微擦线）"; }
    } else if (ratio >= 0.8) { timePt = 2; timeDetail = "准点收住（标准 " + duration(timing.plannedSec) + "）"; }
    else if (ratio >= 0.5) { timePt = 1; timeDetail = "准点，但只用了标准时长的 " + Math.round(ratio * 100) + "%"; }
    else { timePt = 0; timeDetail = "只讲了 " + duration(spokenSec) + "，标准是 " + duration(timing.plannedSec); }
  }
  score += timePt;
  parts.push({ label: "时间控制", detail: timeDetail, pt: timePt, max: 2 });

  return { score: Math.min(10, Math.max(1, Math.round(score))), per100, wpm, parts, reasons: [] };
}

function buildAdvice(stats, spokenSec, plannedSec) {
  const tips = [];
  const per100 = stats.rawWords > 0 ? stats.fillerTotal / stats.rawWords * 100 : 0;
  const top = Object.entries(stats.counts).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (stats.fillerTotal === 0 && stats.rawWords >= 15) {
    tips.push("这轮几乎没有口头禅，保持这个状态——不确定的时候宁可停半拍，也不要用「额」去填。");
  } else if (top.length) {
    const [word, n] = top[0];
    tips.push(`最高频的口头禅是「${word}」，说了 ${n} 次，大约每 ${Math.max(1, Math.round(spokenSec / n))} 秒一次。下次想说它的时候，试试闭嘴半秒，停顿比填充词更从容。`);
  }
  if (stats.pauses >= 6) {
    tips.push(`出现了 ${stats.pauses} 次明显停顿（超过 1.5 秒），说明中途在找词。开头先用一句话亮观点，中间就不容易卡。`);
  } else if (stats.pauses <= 2 && stats.rawWords >= 15) {
    tips.push("几乎没有长停顿，节奏很稳。");
  }
  const wpm = spokenSec > 5 ? Math.round(stats.rawWords / spokenSec * 60) : 0;
  if (wpm > 330) tips.push(`语速约 ${wpm} 字/分钟，偏快。讲完一个点稍作停顿，听众更容易接住。`);
  else if (wpm > 0 && wpm < 130) tips.push(`语速约 ${wpm} 字/分钟，偏慢，容易显得没底气。可以试试只讲核心的一两个点，讲透比讲全重要。`);

  // 重复：整段重复比短语重复严重得多，优先提醒
  const rep = stats.repeats || { items: [], phrases: [] };
  const repItems = rep.items || [];
  if (repItems.length) {
    const worst = repItems.slice().sort((a, b) => b.n - a.n || b.text.length - a.text.length)[0];
    tips.push(`有 ${repItems.length} 处把同一段话说了两遍以上，最明显的是「${worst.text.slice(0, 18)}${worst.text.length > 18 ? "…" : ""}」说了 ${worst.n} 遍。习惯性重复上一句，通常是脑子在等下一句——下次卡住时改成停半秒再开口，而不是把上一句再说一遍。`);
  } else if ((rep.phrases || []).length) {
    const p = rep.phrases[0];
    tips.push(`「${p.text}」在几分钟里出现了 ${p.n} 次。同一个说法反复用，听众会觉得你在原地打转——第二遍就换个词，或者直接展开一个新点。`);
  }

  if (plannedSec && spokenSec < plannedSec * 0.4) {
    tips.push(`这轮只讲了约 ${Math.round(spokenSec)} 秒（计划 ${Math.round(plannedSec)} 秒），内容还可以再展开一层：是什么 → 为什么 → 怎么办。`);
  }
  if (stats.fillerTotal > 0 && per100 > 3) {
    tips.push(`口头禅密度偏高（每百字 ${per100.toFixed(1)} 个）。练法：刻意把一句结尾说利索，说满 10 个字再换气，坚持两轮会明显改善。`);
  }
  if (!tips.length) tips.push("整体节奏不错。下次可以给自己加码：同一个题讲第二轮，看看能不能少一半口头禅。");
  return tips.slice(0, 5);
}

/* ---------------- 练习历史 ---------------- */
const HISTORY_KEY = PREFIX + "history";
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch (e) { return []; }
}
function saveHistoryEntry(entry) {
  try {
    const list = loadHistory();
    list.unshift(entry);
    while (list.length > 300) list.pop();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  } catch (e) {}
}
function deleteHistoryEntry(id) {

    localStorage.setItem(HISTORY_KEY, JSON.stringify(loadHistory().filter(e => e.id !== id)));
  } catch (e) {}
}
function clearAllHistory() {

}

/* ---------------- 记录跨设备同步 ----------------
   通道：JSONBin.io（免费额度：每月 1 万次请求、单个 bin 100KB）。
   为什么是它——免注册的云全部实测失败了，别回头再试：
     · jsonblob.com      Cloudflare 403，浏览器 fetch 直接拒
     · kvdb.io           要真实邮箱 + 验证
     · textdb.online     GET 有 CORS 头，但写接口没有 → 浏览器写不了
     · npoint.io         匿名建 bin 一律 500
     · api.restful-api.dev  支持 file:// 跨域，但**单条负载超 ~1.5KB 就 500**，装不下历史
     · 飞书开放平台       预检不返回 CORS 头，网页直连不了
   JSONBin 是唯一实测「Origin: null 也能读写 + 容量够」的（预检返回 ACAO:* 且允许 X-Master-Key）。

   设计要点（很重要，别改坏）：
     1. 本地 localStorage 永远是主存储。云只是「合并通道」——云挂了/额度用尽/数据被清，
        本地一条都不会少，导出备份随时能救回来。
     2. 同步码 = 云上那个 bin 的 id。谁知道码谁能看到这份记录，所以天然隔离：
        朋友的设备首次同步会生成自己的新 bin，记录绝不会混到一起。
     3. 合并按记录 id 去重求并集，同 id 取时间较新的。
     4. 免费版单 bin 只有 100KB，所以按预算从新到旧裁剪——**云端只保留最近的若干条**，
        更早的只在本机，靠「导出备份 / 导入合并」搬运。这一点必须在状态栏如实告诉她。
-------------------------------------------------------------- */
const BIN_API = "https://api.jsonbin.io/v3/b";
const BIN_HELP = "https://jsonbin.io";
const SYNC_KEY = PREFIX + "synccode";        // bin id
const SYNC_MASTER = PREFIX + "syncmaster";   // JSONBin Master Key

function loadSyncCode() { try { return localStorage.getItem(SYNC_KEY) || ""; } catch (e) { return ""; } }
function setSyncCode(c) {
  try { c ? localStorage.setItem(SYNC_KEY, c) : localStorage.removeItem(SYNC_KEY); } catch (e) {}
}
function loadMasterKey() { try { return localStorage.getItem(SYNC_MASTER) || ""; } catch (e) { return ""; } }
function setMasterKey(k) {
  try { k ? localStorage.setItem(SYNC_MASTER, k.trim()) : localStorage.removeItem(SYNC_MASTER); } catch (e) {}
}

// 合并：按 id 求并集；同 id 取 date 较新的，date 相同则取正文更长的
// （云上那份正文可能被截断过，不能让截断版覆盖本地全文）
function mergeEntries(local, remote) {
  const map = new Map();
  [...(remote || []), ...(local || [])].forEach(e => {
    if (!e || !e.id) return;
    const prev = map.get(e.id);
    if (!prev) { map.set(e.id, e); return; }
    const tNew = Date.parse(e.date || 0) || 0, tOld = Date.parse(prev.date || 0) || 0;
    const longer = (e.text || "").length >= (prev.text || "").length;
    if (tNew > tOld || (tNew === tOld && longer)) map.set(e.id, e);
  });
  return [...map.values()].sort((a, b) => (Date.parse(b.date || 0) || 0) - (Date.parse(a.date || 0) || 0));
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const bytesOf = obj => { try { return new Blob([JSON.stringify(obj)]).size; } catch (e) { return JSON.stringify(obj).length; } };

// 跨境访问确实会抖（SSL 握手超时 / 偶发 5xx），所有请求带退避重试
async function fetchRetry(url, opts, tries = 3) {
  let lastErr = null;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, opts);
      if (r.status >= 500 && i < tries - 1) { await sleep(800 * (i + 1)); continue; }
      return r;
    } catch (e) {
      lastErr = e;
      if (i < tries - 1) await sleep(800 * (i + 1));
    }
  }
  throw (lastErr || new Error("网络请求失败"));
}

function binHeaders(extra) {
  const h = Object.assign({ "X-Master-Key": loadMasterKey() }, extra || {});
  return h;
}

async function cloudRead(id) {
  const r = await fetchRetry(BIN_API + "/" + encodeURIComponent(id) + "/latest", {
    headers: binHeaders({ "X-Bin-Meta": "false" })
  });
  if (r.status === 404) return null;
  if (r.status === 401 || r.status === 403) throw new Error("Master Key 不对，或这不是你自己的 bin");
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  // X-Bin-Meta:false 时直接返回 record；万一被忽略则包在 record 里
  return (j && j.record) || j || null;
}
async function cloudCreate(payload) {
  const r = await fetchRetry(BIN_API, {
    method: "POST",
    headers: binHeaders({ "Content-Type": "application/json", "X-Bin-Name": "unprompted-history", "X-Bin-Private": "true" }),
    body: JSON.stringify(payload)
  });
  if (r.status === 401 || r.status === 403) throw new Error("Master Key 无效，检查一下有没有粘全");
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  return (j.metadata && j.metadata.id) || j.id;
}
async function cloudWrite(id, payload) {
  const r = await fetchRetry(BIN_API + "/" + encodeURIComponent(id), {
    method: "PUT",
    headers: binHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify(payload)
  });
  if (r.status === 404) throw new Error("云端 bin 不见了（可能被清理或删了）");
  if (r.status === 401 || r.status === 403) throw new Error("Master Key 不对");
  if (!r.ok) throw new Error("HTTP " + r.status);
}

// 免费版单 bin 上限 100KB → 预算 95KB，从新到旧装，装不下的不传（本地永远全量）
const CLOUD_BUDGET = 95 * 1024;
function slimForCloud(entries) {
  const CAP = 2000;   // 单条正文最多 2000 字
  const cut = s => (typeof s === "string" && s.length > CAP ? s.slice(0, CAP) + "…" : s);
  const out = [];
  let used = 200;     // 留点余量给外层字段
  for (const e of entries) {
    const copy = Object.assign({}, e);
    if (copy.text) copy.text = cut(copy.text);
    if (copy.analysis) {
      // 洗稿文本是**能从原稿重算**的（analyzeSpeech(text).cleaned），
      // 没必要占云端空间——省下的额度能多存一倍的记录。
      const a = Object.assign({}, copy.analysis);
      delete a.cleaned;
      copy.analysis = a;
    }
    const size = bytesOf(copy) + 2;
    if (used + size > CLOUD_BUDGET) break;
    out.push(copy);
    used += size;
  }
  return { entries: out, kept: out.length, total: entries.length, truncated: out.length < entries.length };
}

let syncing = false;
async function syncNow() {
  if (syncing) return;
  syncing = true;
  setSyncStatus("正在同步……");
  try {
    if (!loadMasterKey()) {
      setSyncStatus("还没配置云账号：先在下面填 JSONBin 的 Master Key（免费注册，一次搞定），再点同步。");
      return;
    }
    const local = loadHistory();
    let code = loadSyncCode();
    let remote = null;
    let codeRotated = false;

    if (code) {
      remote = await cloudRead(code);
      if (remote === null) {
        // 这个 bin 在云端不存在了（第一次用 / 被清 / 被删）。
        // 这时不能 PUT（会 404），必须重新建一个。
        codeRotated = true;
        code = "";
      }
    }

    const merged = mergeEntries(local, remote ? (remote.entries || []) : []);
    const slim = slimForCloud(merged);
    const payload = { ver: 1, updatedAt: new Date().toISOString(), entries: slim.entries };

    if (!code) { code = await cloudCreate(payload); setSyncCode(code); }
    else { await cloudWrite(code, payload); }

    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(merged.slice(0, 300))); } catch (e) {}
    renderHistoryList();
    if (historyEl && historyEl._codeInput) historyEl._codeInput.value = code;

    const added = merged.length - local.length;
    const parts = ["同步完成", "本机共 " + merged.length + " 条"];
    if (added > 0) parts.push("从别的设备合并进来 " + added + " 条");
    else parts.push("已是最新");
    if (slim.truncated) parts.push("云端按 100KB 免费额度只存了最近 " + slim.kept + " 条，更早的只在本机——想全量搬运请用「导出备份 / 导入合并」");
    if (codeRotated) parts.push("※ 原来的同步码在云端已不存在，已生成新码——请把新码填到其他设备上");
    setSyncStatus(parts.join(" · "));
  } catch (e) {
    setSyncStatus("同步失败：" + (e.message || e) + "。本地记录没动，放心。");
  } finally {
    syncing = false;
  }
}

function exportHistory() {
  const data = { app: "unprompted", ver: 1, exportedAt: new Date().toISOString(), entries: loadHistory() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "即兴演讲练习记录-" + new Date().toISOString().slice(0, 10) + ".json";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  setSyncStatus("已导出 " + loadHistory().length + " 条记录。存到飞书/网盘，在另一台设备导入即可合并。");
}

function importHistoryFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      const incoming = Array.isArray(j) ? j : (j.entries || []);
      if (!incoming.length) { setSyncStatus("这个文件里没有记录。"); return; }
      const before = loadHistory().length;
      const merged = mergeEntries(loadHistory(), incoming);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(merged.slice(0, 300)));
      renderHistoryList();
      setSyncStatus("导入完成 · 原 " + before + " 条 → 现 " + merged.length + " 条（按记录去重合并）");
    } catch (e) {
      setSyncStatus("导入失败：文件不是本工具导出的记录文件。");
    }
  };
  fr.readAsText(file);
}

/* ---------------- 计时 ---------------- */
let intervalId = null;
function stopTimer() {
  if (intervalId !== null) { clearInterval(intervalId); intervalId = null; }
}
function startTimer(seconds, onEnd) {
  stopTimer();
  state.remaining = seconds;
  renderOverlay();
  const endAt = Date.now() + seconds * 1000;
  intervalId = setInterval(() => {
    const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    state.remaining = left;
    renderOverlay();
    if (left <= 0) { stopTimer(); onEnd(); }
  }, 100);
}

async function startSpeech() {
  state.phase = "speech";
  state.overtime = 0;
  state.remaining = state.speech;
  renderOverlay();

  // 先把麦克风拿到手，再开始计时。
  // 否则用户讲完一整轮才发现没录上，等于白讲一遍（手机内置浏览器就是这种情况）。
  setCaptureState("starting", "正在打开麦克风……首次会弹权限窗，请点「允许」。");
  await Promise.race([beginCapture(), sleep(20000)]);
  if (state.phase !== "speech") return;      // 等待授权期间被放弃/关闭了

  if (session) {
    session.speechStartedAt = Date.now();
    session.speechPlannedSec = state.speech;
  }
  renderOverlay();
  startTimer(state.speech, () => {
    // 时间到：响铃提示，但不打断——进入超时继续计，说完自己点「我说完了」
    finishChime();
    startOvertime();
  });
}
function startOvertime() {
  stopTimer();
  state.phase = "overtime";
  state.overtime = 0;
  renderOverlay();
  const startAt = Date.now();
  intervalId = setInterval(() => {
    state.overtime = Math.floor((Date.now() - startAt) / 1000);
    renderOverlay();
  }, 250);
}
function finishSpeech() {
  stopTimer();
  const punctual = state.phase === "speech";   // 倒计时归零前就说完了
  state.phase = "done";
  state.remaining = 0;
  state.overtime = 0;
  if (session) {
    session.spokenSec = Math.round((Date.now() - session.speechStartedAt) / 1000);
    session.overtimeSec = Math.max(0, session.spokenSec - (session.speechPlannedSec || state.speech));
    session.punctual = punctual || session.overtimeSec <= 0;
    session.completed = true;
  }
  endCapture();     // 说完即停录：复盘直接分析刚才这一遍
  renderOverlay();
  // 等最后一批识别结果回灌（rec.stop 是异步的），再自动进复盘
  setTimeout(() => { if (session && state.phase === "done" && !reviewOpen) openReview(); }, 450);
}
function goReady() {
  stopTimer();
  state.phase = "ready";
  state.remaining = state.speech;
  renderOverlay();
  landChime();
}
function startFlow() {
  if (!state.landed || locked()) return;
  primeAudio();
  session = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    date: new Date().toISOString(),
    topic: state.landed,
    categoryLabel: catById(state.niche).label,
    modeLabel: modeById(state.mode).label,
    plannedSec: state.mode === "deep-research" ? state.research + state.speech : state.speech,
    spokenSec: 0,
    text: "",
    analysis: null,
    score: null,
    completed: false,
    saved: false,
    speechStartedAt: 0,
    speechPlannedSec: 0,
    overtimeSec: 0,
    punctual: null
  };
  if (state.mode === "deep-research") {
    state.phase = "research";
    renderOverlay();
    startTimer(state.research, () => { goReady(); });
  } else {
    startSpeech();
  }
}
function finishSession() {
  // 计时完整走完（done）才算完成一轮，才写入历史；中途放弃不记录
  if (session && !session.saved) {
    session.saved = true;
    saveHistoryEntry({
      id: session.id, date: session.date, topic: session.topic,
      categoryLabel: session.categoryLabel, modeLabel: session.modeLabel,
      plannedSec: session.plannedSec, spokenSec: session.spokenSec,
      punctual: session.punctual, overtimeSec: session.overtimeSec,
      text: session.text, analysis: session.analysis, score: session.score
    });
  }
  stopReview();
  endCapture();          // 放弃/收工：一定要关掉麦克风，别让录音在后台空转
  session = null;
  stopTimer();
  state.phase = "idle";
  state.overtime = 0;
  state.remaining = state.speech;
  renderOverlay();
}
function closeTimer() {
  if (state.phase === "done" && session) {
    session.completed = true;
    finishSession();
    return;
  }
  if (state.phase === "research" || state.phase === "ready") {
    if (!confirm("这一轮还没开讲。关闭后不会计入历史，抽到的题目也会清掉。确定关闭吗？")) return;
  } else if (state.phase === "speech" || state.phase === "overtime") {
    if (!confirm("这轮还没点「我说完了」，放弃后不会计入历史。确定放弃吗？")) return;
  }
  stopReview();
  endCapture();          // 放弃/收工：一定要关掉麦克风，别让录音在后台空转
  session = null;
  stopTimer();
  state.phase = "idle";
  state.overtime = 0;
  state.remaining = state.speech;
  renderOverlay();
}

/* ---------------- 计时浮层 ---------------- */
function stageCount() {
  if (state.phase === "done" || state.phase === "overtime" || state.speech <= 0) return STAGES.length;
  const elapsed = state.speech - state.remaining;
  const seg = state.speech / STAGES.length;
  if (elapsed >= seg * 2) return 3;
  if (elapsed >= seg) return 2;
  return 1;
}
function ringProgress() {
  const isResearch = state.phase === "research";
  const total = isResearch ? state.research : state.speech;
  if (state.phase === "ready") return 0;
  if (state.phase === "overtime" || state.phase === "done") return 1;
  if (!running()) return 0;
  if (total <= 0) return 1;
  return clamp(1 - state.remaining / total, 0, 1);
}
function overlayLabel() {
  if (state.phase === "research") return "研究计时";
  if (state.phase === "ready") return "准备开讲";
  if (state.phase === "overtime") return "超时加时";
  return "演讲计时";
}
function overlayStatus() {
  if (state.phase === "research") return "研究中。";
  if (state.phase === "ready") return "研究结束。";
  if (state.phase === "overtime") return "时间到。不打断，继续说——说完点「我说完了」。";
  if (state.phase === "done") return "时间到。";
  return "开讲。";
}

function renderOverlay() {
  if (!running()) {
    if (overlay) { overlay.remove(); overlay = null; }
    releaseWake();
    render();
    return;
  }
  const isResearch = state.phase === "research";
  const showStages = state.mode === "off-the-cuff" && (state.phase === "speech" || state.phase === "overtime" || state.phase === "done");

  if (!overlay) {
    overlay = el("div", "timer-overlay");
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    const inner = el("div", "timer-overlay-inner");
    overlay.appendChild(inner);
    ui.overlayHost.appendChild(overlay);
    overlay._built = false;
  }
  overlay.className = "timer-overlay " + (state.phase === "done" ? "is-done" : state.phase === "overtime" ? "is-overtime" : "is-live") + (isResearch ? " is-research" : "");
  overlay.setAttribute("aria-label", overlayLabel());

  const inner = overlay.firstChild;
  if (!overlay._built) {
    inner.innerHTML = "";
    overlay.topic = el("p", "timer-topic");
    overlay.phase = el("p", "timer-phase", "研究中");
    overlay.stages = el("ol", "speech-stages");
    overlay.stages.setAttribute("aria-label", "演讲结构");
    overlay.ring = el("div", "timer-ring");
    overlay.ring.setAttribute("role", "timer");
    overlay.digits = el("span", "timer-digits");
    overlay.ring.appendChild(overlay.digits);
    overlay.status = el("p", "timer-status");
    overlay.status.setAttribute("aria-live", "polite");
    overlay.recChip = el("button", "timer-rechip", "○ 未录音");
    overlay.recChip.type = "button";
    overlay.recChip.addEventListener("click", () => { primeAudio(); toggleCapture(); });
    // 录音失败时把原因写在浮层上——只在复盘面板里说明，用户在计时界面是看不到的
    overlay.recNote = el("p", "timer-recnote");
    overlay.next = el("p", "timer-next");
    overlay.acts = el("div", "timer-actions");

    overlay.researchDone = el("button", "btn primary", "研究完毕");
    overlay.researchDone.type = "button";
    overlay.researchDone.addEventListener("click", () => { primeAudio(); goReady(); });

    overlay.readyBtn = el("button", "btn primary", "我准备好开讲了");
    overlay.readyBtn.type = "button";
    overlay.readyBtn.addEventListener("click", () => { primeAudio(); startSpeech(); });

    overlay.closeBtn = el("button", "btn ghost", "关闭");
    overlay.closeBtn.type = "button";
    overlay.closeBtn.addEventListener("click", closeTimer);

    overlay.doneBtn = el("button", "btn primary", "我说完了");
    overlay.doneBtn.type = "button";
    overlay.doneBtn.addEventListener("click", () => { primeAudio(); finishSpeech(); });

    overlay.reviewBtn = el("button", "btn primary", "输出复盘 · 找口头禅");
    overlay.reviewBtn.type = "button";
    overlay.reviewBtn.addEventListener("click", openReview);

    overlay.acts.appendChild(overlay.researchDone);
    overlay.acts.appendChild(overlay.readyBtn);
    overlay.acts.appendChild(overlay.doneBtn);
    overlay.acts.appendChild(overlay.reviewBtn);
    overlay.acts.appendChild(overlay.closeBtn);

    inner.appendChild(overlay.topic);
    inner.appendChild(overlay.phase);
    inner.appendChild(overlay.stages);
    inner.appendChild(overlay.ring);
    inner.appendChild(overlay.status);
    inner.appendChild(overlay.recChip);
    inner.appendChild(overlay.recNote);
    inner.appendChild(overlay.next);
    inner.appendChild(overlay.acts);
    overlay._built = true;
  }

  overlay.topic.textContent = state.landed || "";
  overlay.topic.style.display = state.landed ? "" : "none";
  overlay.phase.style.display = isResearch ? "" : "none";

  overlay.stages.style.display = showStages ? "" : "none";
  if (showStages) {
    const hit = stageCount();
    overlay.stages.innerHTML = "";
    STAGES.forEach((s, i) => {
      const li = el("li", "speech-stage " + (i < hit ? "is-hit" : "is-pending"));
      li.appendChild(el("span", "speech-stage-label", s));
      overlay.stages.appendChild(li);
    });
  }

  overlay.ring.style.setProperty("--p", ringProgress());
  overlay.digits.textContent = state.phase === "overtime" ? "+" + clock(state.overtime) : clock(state.remaining);
  overlay.status.textContent = overlayStatus();
  overlay.next.style.display = state.phase === "ready" ? "" : "none";
  overlay.next.textContent = "接下来：演讲 " + duration(state.speech) + "。";
  overlay.researchDone.style.display = isResearch ? "" : "none";
  overlay.readyBtn.style.display = state.phase === "ready" ? "" : "none";
  overlay.doneBtn.style.display = (state.phase === "speech" || state.phase === "overtime") ? "" : "none";
  overlay.doneBtn.textContent = state.phase === "overtime" ? "我说完了（已超时 " + clock(state.overtime) + "）" : "我说完了";
  overlay.reviewBtn.style.display = state.phase === "done" ? "" : "none";
  overlay.closeBtn.textContent = state.phase === "done" ? "直接收工"
    : (state.phase === "speech" || state.phase === "overtime") ? "放弃这轮" : "关闭";

  renderCaptureUI();   // 录音胶囊跟着阶段走（只在 speech/overtime 出现）

  const focusTarget = isResearch ? overlay.researchDone
    : state.phase === "ready" ? overlay.readyBtn
    : state.phase === "done" ? overlay.reviewBtn
    : (state.phase === "speech" || state.phase === "overtime") ? overlay.doneBtn
    : overlay.closeBtn;
  if (document.activeElement !== focusTarget && overlay.contains(document.activeElement) === false) {
    focusTarget.focus({ preventScroll: true });
  }
  requestWake();
  render();
}

/* ---------------- 输出复盘（语音转写 + 口头禅分析） ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let reviewEl = null, reviewOpen = false, reviewAnalyzed = false;
let rec = null, recActive = false, recFinalText = "", recInterim = "", lastFinalAt = 0;
const PAUSE_MIN_MS = 1500;

function reviewFmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function openReview() {
  if (!session || reviewOpen) return;
  reviewOpen = true;
  reviewAnalyzed = false;
  // ⚠️ 不要清空 recFinalText：它装着「刚才那一遍」的转写，复盘直接分析它

  reviewEl = el("div", "review-overlay");
  reviewEl.setAttribute("role", "dialog");
  reviewEl.setAttribute("aria-modal", "true");
  reviewEl.addEventListener("mousedown", e => { if (e.target === reviewEl) closeReview(); });
  reviewEl.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeReview(); }
  }, true);

  const panel = el("div", "review-panel");
  panel.appendChild(el("h2", "review-title", "输出复盘"));
  panel.appendChild(el("p", "review-topic", session.topic));

  const hasText = !!recFinalText.trim();

  // ① 一行状态：这一遍到底录到了什么。全文只此一句，别处不再重复说明。
  const status = el("p", "review-status", "");
  panel.appendChild(status);

  // ② 一排工具：重新录 / 保存录音（并排，就这两个）
  const toolRow = el("div", "review-rec-row");

  const recBtn = el("button", "btn tool", "重新录一遍");
  recBtn.type = "button";
  recBtn.addEventListener("click", () => {
    recFinalText = ""; recInterim = ""; lastFinalAt = 0;
    reviewAnalyzed = false;
    acts.style.display = "";        // 重新录之后要能再点「生成分析」
    result.style.display = "none";
    session.recordedAgain = true;
    beginCapture();                 // 立刻重新取麦克风
  });
  toolRow.appendChild(recBtn);

  // 音频留底下载（没有录音时这一格是空的，自然不占位）
  const audioBox = el("div", "review-audio");
  toolRow.appendChild(audioBox);
  panel.appendChild(toolRow);

  // ③ 转写正文（有内容才显示，空的时候完全不占位）
  const textBox = el("div", "review-text");
  textBox.setAttribute("aria-live", "polite");
  panel.appendChild(textBox);

  // ③b 修正文字：小字链接，紧挨转写，有转写时才出现
  const pasteToggle = el("button", "review-edit-link", "手动修正文字");
  pasteToggle.type = "button";
  pasteToggle.addEventListener("click", () => {
    const opening = pasteWrap.style.display === "none";
    pasteWrap.style.display = opening ? "" : "none";
    pasteToggle.textContent = opening ? "收起" : "手动修正文字";
    if (opening) { pasteArea.focus(); pasteArea.setSelectionRange(pasteArea.value.length, pasteArea.value.length); }
  });
  panel.appendChild(pasteToggle);

  const chips = el("div", "filler-chips");
  panel.appendChild(chips);

  // ④ 粘贴 / 编辑兜底：没转出文字时直接展开，有文字时收起来
  const pasteWrap = el("div", "review-paste");
  const pasteArea = document.createElement("textarea");
  pasteArea.placeholder = "把刚才讲的内容粘贴或写在这里，然后点「生成分析」";
  pasteArea.value = recFinalText;
  pasteArea.addEventListener("input", () => {
    recFinalText = pasteArea.value;
    renderLive();
  });
  pasteWrap.appendChild(pasteArea);
  panel.appendChild(pasteWrap);

  const acts = el("div", "review-actions");
  const analyzeBtn = el("button", "btn primary", "生成分析");
  analyzeBtn.type = "button";
  analyzeBtn.addEventListener("click", () => { endCapture(); analyzeNow(); });
  acts.appendChild(analyzeBtn);
  const skipBtn = el("button", "btn ghost", "跳过复盘，直接收工");
  skipBtn.type = "button";
  skipBtn.addEventListener("click", finishSession);
  acts.appendChild(skipBtn);
  panel.appendChild(acts);

  const result = el("div");
  result.style.display = "none";
  panel.appendChild(result);

  reviewEl.appendChild(panel);
  ui.overlayHost.appendChild(reviewEl);
  reviewEl._refs = { recBtn, status, textBox, chips, acts, analyzeBtn, skipBtn, pasteToggle, result, panel, audioBox, pasteArea, pasteWrap };

  pasteWrap.style.display = hasText ? "none" : "";
  pasteToggle.style.display = hasText ? "" : "none";
  if (!hasText) pasteArea.placeholder = "把刚才讲的内容粘贴或写在这里，然后点「生成分析」";

  renderAudioBox(audioBox);
  renderLive();   // 画刚才那一遍的转写与口头禅统计
  renderStatusLine();
  setTimeout(() => { if (recBtn.isConnected) recBtn.focus({ preventScroll: true }); }, 60);

  // 已经有转写 → 直接出分析（白姐要的就是「不用再讲一遍、直接分析」）
  if (hasText) setTimeout(() => { if (reviewOpen && !reviewAnalyzed) analyzeNow(); }, 260);
}

/* 复盘面板唯一的那句状态说明：说清楚「录到了什么 / 没录到怎么办」 */
function renderStatusLine() {
  const refs = reviewEl && reviewEl._refs;
  if (!refs || !refs.status) return;
  const hot = captureState === "listening" || captureState === "recording";
  const hasText = !!recFinalText.trim();
  const words = recFinalText.replace(PAUSE_MARK_RE, "").replace(/\s/g, "").length;
  let text;
  if (captureState === "starting") text = "正在打开麦克风……";
  else if (captureState === "error") text = captureNote || "麦克风没打开";
  else if (hot) text = hasText ? "正在听你说…（已转 " + words + " 字）" : "正在听你说……";
  else text = hasText
    ? "已捕获刚才那一遍 · 转写 " + words + " 字" + (pendingAudio ? " · 音频已留底" : "")
    : (pendingAudio
        ? "这一遍没转成文字 · 录音已留底，点「保存录音」发我离线转写"
        : "这一遍没录上 · 说一段，或直接粘贴文字");
  refs.status.textContent = text;
  refs.status.classList.toggle("is-live", hot);
}

let mediaRec = null, mediaChunks = [], mediaStream = null, mediaActive = false;
let mediaPurpose = "backup";   // backup=识别同时留底音（默认） | primary=识别不可用，录音是唯一产物
let recWatchdog = null;        // 识别假死看门狗
let lastResultAt = 0;          // 最后一次拿到转写结果的时间戳
let captureState = "off";      // off | starting | listening | recording | error
let captureNote = "";          // 面向用户的状态说明
let pendingAudio = null;       // {url,name,purpose}：复盘面板还没打开时，录音先存这

// ⚠️ 线上版是被发布平台套在跨域 iframe 里打开的，而那个 iframe 上没有 allow="microphone"
// → 浏览器一律拒绝 getUserMedia（NotAllowedError「Permission denied」，8ms 即时拒绝）。
// 这跟用户用什么浏览器、系统有没有给麦克风权限**完全无关**（桌面 Chrome 一样失败）。
//
// 逃出去的四条路都实测过，只有最后一条通：
//   ✗ window.open(location.href)           → 产物直链被静态服务器拦成「Security Restriction」页
//   ✗ about:blank + document.write         → 同样被拦
//   ✗ fetch 源码 → blob: URL 开新窗口       → Chromium 能用，但 **iOS Safari 不给 blob 页麦克风**（白姐实测）
//   ✓ 托管直链（同内容上传成公网 https 直链）→ 顶层文档 + 麦克风正常
//
// 所以：把「专用直链」的地址写进 DIRECT_HOST_URL，嵌入页的按钮直接开它。
// ⚠️ 每次重新上传直链后，这个常量要同步更新并重新发布壳页（否则按钮指向旧版本，虽仍可用）。
const DIRECT_HOST_URL = "https://workbuddy-space-static.codebuddy.work/image/YBdBEMZLcJSlI1p9UnM9Qx.bin";
const IS_FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const IS_BLOB_PAGE = location.protocol === "blob:";

// 兜底：万一没有专用直链，就退回 blob 方案（Chromium 可用）
let selfHtmlCache = null;
if (IS_FRAMED && !DIRECT_HOST_URL) {
  fetch(location.href, { cache: "no-store" })
    .then(r => (r.ok ? r.text() : null))
    .then(t => { if (t && /即兴/.test(t)) selfHtmlCache = t; })
    .catch(() => {});
}

function openStandalone() {
  // 首选：专用直链（顶层 https 文档，麦克风正常）
  if (DIRECT_HOST_URL) {
    let w = null;
    try { w = window.open(DIRECT_HOST_URL, "_blank"); } catch (e) {}
    if (w) return true;
    setCaptureState("error", "新窗口被浏览器拦住了。请允许本站弹窗，或直接访问专用链接：" + DIRECT_HOST_URL);
    return false;
  }
  // 兜底：blob
  if (!selfHtmlCache) {
    setCaptureState("error", "正在准备独立窗口的页面（约 1 秒），请再点一次「在新窗口打开」。");
    return false;
  }
  let url = "", w = null;
  try {
    url = URL.createObjectURL(new Blob([selfHtmlCache], { type: "text/html" }));
    w = window.open(url, "_blank");
  } catch (e) {}
  if (!w) {
    setCaptureState("error", "新窗口被浏览器拦住了。请允许本站弹窗，或改用电脑上的本地文件录音；这一轮也可以把文字粘贴进复盘。");
    return false;
  }
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);
  return true;
}

// 显式申请麦克风权限——浏览器只有拿到这个调用才会弹「允许」弹窗
async function ensureMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
  return await navigator.mediaDevices.getUserMedia({ audio: true });
}

// App 内置浏览器（微信/飞书/钉钉/WorkBuddy 等 webview）基本都不给麦克风权限，
// 必须把用户引导到系统浏览器，否则他只会反复点「重开」而永远失败。
function isWebviewBrowser() {
  const ua = navigator.userAgent || "";
  if (/MicroMessenger|QQ\/|DingTalk|Lark|Feishu|wxwork|WorkBuddy|Alipay|Weibo|Quark|UCBrowser|baiduboxapp/i.test(ua)) return true;
  // iOS：有 AppleWebKit 却没有 Safari，基本就是 App 内的 webview
  if (/iPhone|iPad|iPod/.test(ua) && /AppleWebKit/.test(ua) && !/Safari/.test(ua)) return true;
  // Android webview 的经典标记
  if (/Android/.test(ua) && /;\s*wv\)/.test(ua)) return true;
  return false;
}
function micHelpText() {
  // 嵌入窗口是第一优先级——这条跟浏览器/系统设置都无关，说别的都是误导
  if (IS_FRAMED) {
    return "录音需要在独立窗口打开。现在的页面是嵌在网页里的，这种嵌入页会被浏览器一律禁掉麦克风，跟你手机的系统设置无关。"
      + (DIRECT_HOST_URL ? "点页面顶部的「用专用链接打开」，在那里开讲就能录了。" : "点页面顶部的「在新窗口打开」。");
  }
  // iOS Safari 不给 blob 临时页面麦克风权限（Chromium 可以），只能换真正的直链
  if (IS_BLOB_PAGE) {
    return "这是临时页面，iOS Safari 不给它麦克风权限。请用发发给你的「专用链接」打开（可以加到主屏幕），或者改用电脑上的桌面快捷方式录音。";
  }
  if (!window.isSecureContext) return "录音必须用 https 打开（现在是 http 或本地文件），换成线上链接再试。";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return isWebviewBrowser()
      ? "你现在是在 App 自带的浏览器里打开的，这类内置浏览器不放麦克风权限。点右上角「···」→ 用 Safari / Chrome 打开这个链接，再从那里开讲。"
      : "这个浏览器不支持录音，换 Safari 或 Chrome 打开。";
  }
  if (isWebviewBrowser()) {
    return "看起来你在 App 自带的浏览器里。这类内置浏览器通常不给麦克风，点右上角「···」→ 用 Safari / Chrome 打开这个链接再试。";
  }
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    return "请到 iPhone「设置 → Safari → 麦克风」确认是「允许」，然后刷新页面、重新开讲。";
  }
  return "点浏览器地址栏的 🔒（或 🎤）图标 → 把「麦克风」改成允许，再点浮层上的「没录上 · 点这里重开」。";
}

// 采集状态是「录音/识别」与「界面」之间唯一的桥：浮层和复盘面板都读它
function setCaptureState(s, note) {
  captureState = s;
  if (note !== undefined) captureNote = note;
  renderCaptureUI();
}

// 渲染采集状态到两个界面（计时浮层的胶囊 + 复盘面板的状态行）
function renderCaptureUI() {
  const hot = captureState === "listening" || captureState === "recording";
  if (overlay && overlay.recChip) {
    const live = state.phase === "speech" || state.phase === "overtime";
    overlay.recChip.style.display = live ? "" : "none";
    overlay.recChip.textContent =
      captureState === "listening" ? "● 正在听你说"
      : captureState === "recording" ? "● 正在录音"
      : captureState === "starting" ? "○ 正在打开麦克风…"
      : captureState === "error" ? "⚠ 没录上 · 点这里重开"
      : "○ 未录音 · 点这里开启";
    overlay.recChip.classList.toggle("is-hot", hot);
    if (overlay.recNote) {
      const showNote = live && (captureState === "error" || captureState === "starting");
      overlay.recNote.style.display = showNote ? "" : "none";
      overlay.recNote.textContent = showNote ? (captureNote || "") : "";
    }
  }
  const refs = reviewEl && reviewEl._refs;
  if (refs) renderStatusLine();
}

// 把录音产物渲染成「保存录音」按钮（复盘面板打开前后都能用）
function renderAudioBox(box) {
  if (!box) return;
  box.innerHTML = "";
  if (!pendingAudio) return;
  const a = el("a", "btn tool", "⬇ 保存录音");
  a.href = pendingAudio.url;
  a.download = pendingAudio.name;
  a.setAttribute("aria-label", "保存这段录音");
  box.appendChild(a);
}

// 本地录音：识别可用时留底音（原始音频永不丢），识别不可用时它就是唯一产物
function startLocalRec(stream, purpose) {
  try {
    if (!window.MediaRecorder) return false;
    mediaPurpose = purpose || "backup";
    mediaChunks = [];
    mediaStream = stream;
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => { if (e.data && e.data.size) mediaChunks.push(e.data); };
    mediaRec.onstop = () => {
      mediaActive = false;
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (!mediaChunks.length) return;
      const type = mediaRec.mimeType || "audio/webm";
      const blob = new Blob(mediaChunks, { type });
      // 后缀跟着实际格式走：Safari 录出来是 mp4，硬写 .webm 会导致手机上打不开
      const ext = /mp4|m4a|aac/i.test(type) ? "m4a" : /ogg/i.test(type) ? "ogg" : "webm";
      pendingAudio = {
        url: URL.createObjectURL(blob),
        name: "演讲录音-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + "." + ext,
        purpose: mediaPurpose
      };
      // 面板已经开着就直接画；还没开就等 openReview 时再画
      if (reviewEl && reviewEl._refs) renderAudioBox(reviewEl._refs.audioBox);
    };
    mediaRec.start();
    mediaActive = true;
    return true;
  } catch (e) { return false; }
}
function stopLocalRec() {
  try { if (mediaRec && mediaRec.state !== "inactive") mediaRec.stop(); } catch (e) {}
}

/* 开讲即开始采集：麦克风 + 实时识别 + 并行留底音。
   这一步必须在「开讲」时做，否则用户要在复盘里再讲一遍（讲两遍的 bug 根因）。
   ⚠️ 并发保护用独立的 captureBusy 标志，不能用 captureState === "starting"：
   startSpeech() 会先把状态置成 starting 再调进来，用状态当锁会把自己挡在门外。 */
let captureBusy = false;
async function beginCapture() {
  if (captureBusy || recActive || mediaActive) return;
  captureBusy = true;
  pendingAudio = null;
  setCaptureState("starting", "正在打开麦克风……首次会弹权限窗，请点「允许」。");

  let stream = null;
  try {
    stream = await ensureMic();
  } catch (e) {
    const name = (e && e.name) || "";
    setCaptureState("error", "没录上音。" + micHelpText());
    captureBusy = false;
    return;
  }
  // 等待授权期间这一轮可能已经结束/被放弃
  if (state.phase !== "speech" && state.phase !== "overtime") {
    stream.getTracks().forEach(t => t.stop());
    captureBusy = false;
    return;
  }

  // 录音一路并行开着：识别正常就当底音留档，识别挂了它就是唯一产物
  const recBackup = startLocalRec(stream, "backup");

  if (SR) {
    let recBroken = false;
    try {
      rec = new SR();
      rec.lang = "zh-CN";
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = e => {
        lastResultAt = Date.now();
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          if (res.isFinal) {
            const now = Date.now();
            if (lastFinalAt && now - lastFinalAt > PAUSE_MIN_MS && recFinalText.trim()) {
              recFinalText += "（停顿 " + ((now - lastFinalAt) / 1000).toFixed(1) + " 秒）";
            }
            recFinalText += res[0].transcript;
            lastFinalAt = now;
          } else {
            interim += res[0].transcript;
          }
        }
        recInterim = interim;
        renderLive();
      };
      rec.onerror = e => {
        const err = e.error || "";
        if (err === "no-speech" || err === "aborted") return;   // 常见抖动，onend 会自动重启
        recBroken = true;                                        // 其余错误不再无限重启
        recActive = false;
        if (err === "network" || err === "service-not-allowed") {
          recInterim = "";
          if (mediaActive) {
            mediaPurpose = "primary";
            setCaptureState("recording", "实时转写连不上外网服务，已转为纯本地录音——你说的话一点没丢，说完点「我说完了」，我把录音留给你下载。");
          } else {
            setCaptureState("error", "转写服务连不上，也没录上音。复盘里可以粘贴文字。");
          }
        } else if (err === "not-allowed") {
          setCaptureState("error", "转写服务被拒。" + micHelpText());
        } else if (err === "audio-capture") {
          setCaptureState("error", "没检测到麦克风设备，检查系统声音输入设置。");
        } else {
          setCaptureState("error", "转写出错（" + err + "）。复盘里可以粘贴文字。");
        }
      };
      rec.onend = () => { if (recActive && !recBroken) { try { rec.start(); } catch (err) {} } };
      recActive = true;
      lastFinalAt = Date.now();
      lastResultAt = Date.now();
      rec.start();
      setCaptureState(recBackup ? "listening" : "recording",
        recBackup ? "正在听你说，原始音频同时留底。倒计时归零不会打断，说完点「我说完了」。"
                  : "正在录音。说完点「我说完了」。");

      // 看门狗：识别可能既不报错也不吐字（外网服务被墙时的典型表现）。
      // 12 秒一个字都没出来，就判定它废了，直接转纯录音，别让用户对着死掉的识别器白讲。
      clearInterval(recWatchdog);
      recWatchdog = setInterval(() => {
        if (!recActive || recBroken) { clearInterval(recWatchdog); recWatchdog = null; return; }
        if (Date.now() - lastResultAt < 12000) return;
        clearInterval(recWatchdog);
        recWatchdog = null;
        recBroken = true;
        recActive = false;
        try { rec.stop(); } catch (e) {}
        if (mediaActive) {
          mediaPurpose = "primary";
          setCaptureState("recording", "实时转写 12 秒没吐出一个字，基本确定连不上外网服务——已切成纯本地录音，你说的话一点没丢。说完点「我说完了」，我把录音留给你下载。");
        }
      }, 2000);
      captureBusy = false;
      return;
    } catch (e) { recActive = false; /* 走本地录音兜底 */ }
  }

  // 不支持实时识别：录音就是唯一产物
  if (mediaActive) {
    mediaPurpose = "primary";
    setCaptureState("recording", "当前浏览器不支持实时转写，正在录音。说完点「我说完了」，录音会留给你下载。");
  } else {
    stream.getTracks().forEach(t => t.stop());
    setCaptureState("error", "录音启动失败——复盘里可以粘贴文字。");
  }
  captureBusy = false;
}

// 说完即停止采集（复盘直接分析这一段，不再要求重讲）
function endCapture() {
  clearInterval(recWatchdog); recWatchdog = null;
  recActive = false;
  captureBusy = false;
  recInterim = "";              // 未定稿的中间结果丢掉，只留 recFinalText
  try { if (rec) rec.stop(); } catch (e) {}
  stopLocalRec();
  captureState = "off";
  renderCaptureUI();
}

// 浮层上的「录音」胶囊：自动开启失败时手动重开
function toggleCapture() {
  if (captureState === "listening" || captureState === "recording") {
    endCapture();
    captureNote = "已停止录音。说完点「我说完了」。";
    renderCaptureUI();
  } else if (IS_FRAMED) {
    openStandalone();   // 嵌入页重试多少次都会被拒，直接带她去独立窗口
  } else {
    beginCapture();
  }
}


function renderLive() {
  // 开讲阶段复盘面板还没开，这时只更新浮层，别炸
  const refs = reviewEl && reviewEl._refs;
  if (!refs) { renderCaptureUI(); return; }
  const { textBox, chips } = refs;
  const full = recFinalText + recInterim;
  const hasContent = !!full.trim();

  textBox.innerHTML = "";
  if (recFinalText) textBox.appendChild(el("span", null, recFinalText));
  if (recInterim) textBox.appendChild(el("span", "interim", recInterim));
  textBox.style.display = hasContent ? "" : "none";   // 空的时候完全不占位

  chips.innerHTML = "";
  chips.style.display = hasContent ? "" : "none";
  if (hasContent) {
    const stats = analyzeSpeech(full, { light: true });
    const mkChip = (label, n, hot) => {
      chips.appendChild(el("span", "filler-chip" + (hot ? " hot" : ""), label + " ×" + n));
    };
    const entries = Object.entries(stats.counts).sort((a, b) => b[1] - a[1]);
    if (!entries.length && !stats.pauses) chips.appendChild(el("span", "filler-chip", "目前很干净 ✓"));
    else {
      entries.forEach(([w, n]) => mkChip(w, n, n >= 3));
      if (stats.pauses) mkChip("停顿", stats.pauses, stats.pauses >= 4);
    }
    // 「说了多少字」由上面那句状态说明负责，这里只放口头禅和停顿，别重复
    textBox.scrollTop = textBox.scrollHeight;

    // 有转写了就把粘贴区收起来（用户正在打字就别收，否则输入框会凭空消失）
    if (refs.pasteWrap && !(refs.pasteArea && refs.pasteArea.value.trim())) {
      refs.pasteWrap.style.display = "none";
      refs.pasteToggle.style.display = "";
      refs.pasteToggle.textContent = "手动修正文字";
    }
  }
  renderStatusLine();
}

function analyzeNow() {
  const { result, acts, status } = reviewEl._refs;
  const full = recFinalText.trim();
  if (!full) {
    status.textContent = "还没有内容 · 说一段或粘贴文字再分析";
    return;
  }
  const stats = analyzeSpeech(full);
  const spoken = Math.max(session.spokenSec || 0, 0);
  const planned = session.speechPlannedSec || 0;
  const sc = scoreSpeech(stats, spoken, {
    punctual: session.punctual,
    overtimeSec: session.overtimeSec || 0,
    plannedSec: planned
  });
  const advice = buildAdvice(stats, spoken, planned || session.plannedSec);
  // 准时/超时也是打分项：超时给硬提醒，准时贴身完成给正反馈
  if (session.punctual === false) {
    advice.unshift(`超时 ${duration(session.overtimeSec || 0)}才收尾。在标准时间内说完是硬指标——下次提纲最后一条直接写结论，时间一到就落这句。`);
  } else if (session.punctual === true && session.speechPlannedSec && spoken >= session.speechPlannedSec * 0.85) {
    advice.unshift(`在 ${duration(session.speechPlannedSec)}内完整收尾，时间控制很好，保持这个节奏。`);
  }

  session.text = full;
  session.analysis = {
    cleaned: stats.cleaned, counts: stats.counts, fillerTotal: stats.fillerTotal,
    pauses: stats.pauses, words: stats.words, rawWords: stats.rawWords,
    per100: +sc.per100.toFixed(1), wpm: sc.wpm || 0,
    parts: sc.parts || [],
    restructured: stats.restructured,
    structure: stats.structure,
    repeatItems: (stats.repeats && stats.repeats.items) || [],
    repeatPhrases: (stats.repeats && stats.repeats.phrases) || [],
    repeatRemoved: (stats.repeats && stats.repeats.removed) || 0
  };
  session.score = sc.score;

  acts.style.display = "none";
  result.style.display = "";
  result.innerHTML = "";

  const badge = el("div", "score-badge");
  const num = el("div", "score-num", sc.score + "/10");
  badge.appendChild(num);
  const timeTag = session.punctual === true ? " · 准时说完 ✓"
    : session.punctual === false ? " · 超时 " + duration(session.overtimeSec || 0) + "说完" : "";
  badge.appendChild(el("div", "score-caption",
    `综合评分 · 说了约 ${Math.round(spoken)} 秒 · ${stats.rawWords} 字`
    + (sc.wpm ? ` · ${sc.wpm} 字/分钟` : "") + timeTag));
  result.appendChild(badge);

  const mkSection = (title) => {
    const sec = el("div", "result-section");
    sec.appendChild(el("p", "result-heading", title));
    result.appendChild(sec);
    return sec;
  };

  const diag = buildDiagnosis(
    stats, spoken, planned,
    { punctual: session.punctual, overtimeSec: session.overtimeSec || 0, plannedSec: planned },
    stats.structure
  );
  const st = stats.structure;
  session.diagnosis = diag;

  /* ===== 诊断结论：主题 / 优点 / 缺点 / 口头禅 / 综合评分 ===== */
  const dxSec = mkSection("诊断结论");
  const dx = el("div", "dx");
  dxSec.appendChild(dx);

  const mkBlock = (cls, icon, label) => {
    const b = el("div", "dx-block");
    const h = el("p", "dx-title " + cls);
    h.appendChild(el("i", null, icon));
    h.appendChild(el("span", null, label));
    b.appendChild(h);
    dx.appendChild(b);
    return b;
  };

  // ① 主题
  const bTopic = mkBlock("t-topic", "◎", "主题");
  if (diag.keywords.length) {
    const kw = el("div", "dx-kw");
    diag.keywords.forEach(k => kw.appendChild(el("span", "kw", k.n > 2 ? k.text + " ×" + k.n : k.text)));
    bTopic.appendChild(kw);
    bTopic.appendChild(el("p", "dx-note", "工具不认语义，这是按出现频次算的核心词，不是概括。"));
  } else {
    // 内容不长、词频都是 1 次时，取不出「反复出现的核心词」——直接把她开场那句摆出来，别空着
    const head = (stats.cleaned || "").split(/[。！？!?]/)[0].trim().slice(0, 22);
    if (head) {
      const kw = el("div", "dx-kw");
      kw.appendChild(el("span", "kw", head + (head.length >= 22 ? "…" : "")));
      bTopic.appendChild(kw);
      bTopic.appendChild(el("p", "dx-note", "内容偏短，取不出反复出现的核心词——上面是你开场那句，不是概括。"));
    } else {
      bTopic.appendChild(el("p", "dx-note", "内容太短，看不出主题。"));
    }
  }

  // ② 优点
  const bPro = mkBlock("t-pro", "✓", "优点");
  if (diag.pros.length) {
    const ul = el("ul", "dx-list pro");
    diag.pros.forEach(p => {
      const li = document.createElement("li");
      li.appendChild(el("b", null, p.t + "："));
      li.appendChild(document.createTextNode(p.e));
      ul.appendChild(li);
    });
    bPro.appendChild(ul);
  } else {
    bPro.appendChild(el("p", "dx-note", "这一轮没找到明显亮点。"));
  }

  // ③ 缺点
  const bCon = mkBlock("t-con", "!", "缺点");
  if (diag.cons.length) {
    const ul = el("ul", "dx-list con");
    diag.cons.forEach(p => {
      const li = document.createElement("li");
      li.appendChild(el("b", null, p.t + "："));
      li.appendChild(document.createTextNode(p.e));
      ul.appendChild(li);
    });
    bCon.appendChild(ul);
  } else {
    bCon.appendChild(el("p", "dx-note", "没有明显硬伤。"));
  }

  // ④ 口头禅
  const bFl = mkBlock("t-fl", "·", "口头禅");
  bFl.appendChild(el("p", "result-note",
    "共 " + stats.fillerTotal + " 处 · " + diag.per100.toFixed(1) + " 处/百字"
    + " · 长停顿 " + stats.pauses + " 次"
    + (repItems0().length ? " · 整段重复 " + repItems0().length + " 处" : "")));
  if (Object.keys(stats.counts).length) {
    const ft = el("table", "freq-table");
    Object.entries(stats.counts).sort((a, b) => b[1] - a[1]).forEach(([w, n]) => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.textContent = "「" + w + "」";
      const td2 = document.createElement("td"); td2.textContent = n + " 次";
      tr.appendChild(td1); tr.appendChild(td2); ft.appendChild(tr);
    });
    bFl.appendChild(ft);
  } else {
    bFl.appendChild(el("p", "dx-note", "一个「嗯啊呢」都没有，这块很干净。"));
  }
  function repItems0() { return (stats.repeats && stats.repeats.items) || []; }

  // ⑤ 综合评分
  const bScore = mkBlock("t-score", "★", "综合评分 · " + sc.score + "/10");
  if (sc.parts && sc.parts.length) {
    const pt = el("table", "freq-table parts-table");
    sc.parts.forEach(p => {
      const tr = document.createElement("tr");
      const td0 = document.createElement("td"); td0.textContent = p.label;
      const td1 = document.createElement("td"); td1.textContent = p.detail;
      const td2 = document.createElement("td");
      td2.textContent = (p.pt >= 0 ? "+" : "") + p.pt + " / " + p.max;
      td2.className = p.pt < 0 ? "pt-neg" : p.pt >= p.max ? "pt-full" : "pt-part";
      tr.appendChild(td0); tr.appendChild(td1); tr.appendChild(td2);
      pt.appendChild(tr);
    });
    bScore.appendChild(pt);
  } else {
    bScore.appendChild(el("p", "dx-note", "内容太短，不构成一次完整输出。"));
  }

  /* ===== 结构骨架：这一轮重排做了什么 ===== */
  if (stats.restructured) {
    const skelSec = mkSection("结构骨架 · 断句、分段、分点都用你录音里的真实停顿");
    const skel = el("div", "skel");
    const mkItem = (txt, ok) => skel.appendChild(el("span", "skel-item" + (ok === true ? " ok" : ok === false ? " no" : ""), txt));
    mkItem(st.paragraphs + " 段");
    mkItem("开场钩子 " + (st.hasHook ? "有" : "没有"), st.hasHook);
    mkItem("收尾落点 " + (st.hasClosing ? "有" : "偏弱"), st.hasClosing);
    mkItem(st.points.length >= 2 ? "分点 " + st.points.length + " 个" : "没有分点", st.points.length >= 2);
    mkItem("具体例子 " + (st.hasExample ? "有" : "没有"), st.hasExample);
    skelSec.appendChild(skel);
  }

  /* ===== 重构稿（结构重排版） ===== */
  if (stats.restructured) {
    const rsSec = mkSection("重构稿 · 按你的思路重排结构：断句、分段、分点");
    rsSec.appendChild(el("p", "result-note", "用词一个字没改，只动了断句、段落和标点。换词和提炼金句需要我出报告时做。"));
    rsSec.appendChild(el("p", "result-cleaned", stats.restructured));
  }

  /* ===== 原稿（只删口头禅和重复） ===== */
  if (stats.cleaned) {
    const cleanedSec = mkSection("原稿 · 只删口头禅和重复句，其余原样");
    cleanedSec.appendChild(el("p", "result-cleaned", stats.cleaned));
  }

  // 重复：白姐特别在意的「习惯性重复前一句话」，和口头禅分开统计
  const rep = stats.repeats || { items: [], phrases: [], removed: 0 };
  const repItems = rep.items || [];
  const repSec = mkSection("重复 · 独立于口头禅的另一类问题");
  if (repItems.length) {
    repSec.appendChild(el("p", "result-note", "你把同一段话说了两遍以上（洗稿里已只保留第一次）"));
    const rt = el("table", "freq-table");
    repItems.forEach(r => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td");
      td1.textContent = "「" + r.text.slice(0, 22) + (r.text.length > 22 ? "…" : "") + "」";
      const td2 = document.createElement("td");
      td2.textContent = "说了 " + r.n + " 遍";
      tr.appendChild(td1); tr.appendChild(td2); rt.appendChild(tr);
    });
    repSec.appendChild(rt);
  }
  if (rep.phrases && rep.phrases.length) {
    repSec.appendChild(el("p", "result-note", "同一个说法反复用（4 次以上，换个词会更有推进感）"));
    const pt2 = el("table", "freq-table");
    rep.phrases.forEach(p => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"), td2 = document.createElement("td");
      td1.textContent = "「" + p.text + "」";
      td2.textContent = p.n + " 次";
      tr.appendChild(td1); tr.appendChild(td2); pt2.appendChild(tr);
    });
    repSec.appendChild(pt2);
  }
  if (!repItems.length && !(rep.phrases || []).length) {
    repSec.appendChild(el("p", "result-note", "没有重复说同一段话，也没有高频复用的短语，这块很干净。"));
  }

  const advSec = mkSection("建议");
  const ul = el("ul", "advice-list");
  advice.forEach(t => ul.appendChild(el("li", null, t)));
  advSec.appendChild(ul);

  const saveActs = el("div", "review-actions");
  const saveBtn = el("button", "btn primary", "存入历史");
  saveBtn.type = "button";
  saveBtn.addEventListener("click", finishSession);
  saveActs.appendChild(saveBtn);
  result.appendChild(saveActs);
  reviewAnalyzed = true;
  result.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeReview() {

  endCapture();

  reviewOpen = false;
}
